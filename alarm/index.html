<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarms · Life Hub</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<script src="../hub.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .alarm { display: flex; align-items: center; gap: 12px; padding: 14px; border-top: 1px solid var(--line); }
  .alarm:first-child { border-top: 0; }
  .alarm .tm { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .alarm.off .tm, .alarm.off .body span { color: var(--muted-2); }
  .alarm .body { flex: 1; min-width: 0; text-align: left; }
  .alarm .body span { display: block; font-size: 12.5px; color: var(--muted); }
  .sw { width: 50px; height: 30px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; transition: .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
  .sw[aria-checked="true"] { background: var(--c); }
  .sw[aria-checked="true"]::after { left: 23px; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days button { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-weight: 800; font-size: 13px; color: var(--muted); }
  .days button[aria-pressed="true"] { background: var(--c); color: #0d0f14; border-color: var(--c); }
  #night { position: fixed; inset: 0; z-index: 85; background: #000; color: #c8c2ff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  #night .clock { font-size: min(26vw, 150px); font-weight: 300; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; opacity: .75; }
  #night .sub { font-size: 16px; opacity: .5; }
  #night .acts { position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); display: flex; gap: 12px; }
  #night .acts button { padding: 12px 18px; border-radius: 14px; background: #15131f; color: #8d86c4; font-weight: 700; }
  #night.ring { animation: flash 1s infinite; color: #fff; }
  #night.ring .clock { opacity: 1; }
  #night .ringbtns { display: none; flex-direction: column; gap: 14px; width: min(320px, 90%); margin-top: 30px; }
  #night.ring .ringbtns { display: flex; }
  #night .info { display: none; max-width: 420px; font-size: 16px; line-height: 1.55; text-align: left; background: #ffffff12; border-radius: 16px; padding: 12px 16px; margin-top: 8px; }
  #night.ring .info { display: block; }
  #night.ring .acts { display: none; }
  #night .awakebtn { display: none; } #night.awake .awakebtn { display: block; background: var(--c) !important; color: #0d0f14 !important; } #night.awake .upbtn { display: none; }
  #night .ringbtns button { padding: 22px; border-radius: 22px; font-size: 20px; font-weight: 800; }
  #night .ringbtns .up { background: var(--c); color: #0d0f14; }
  #night .ringbtns .snooze { background: #2a2740; color: #fff; }
  #ytbox { position: fixed; left: -9999px; top: 0; width: 220px; height: 220px; z-index: 86; border-radius: 16px; overflow: hidden; }
  #ytbox.show { left: calc(50% - 110px); top: calc(12px + env(safe-area-inset-top)); }
  .tone { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .tone:first-child { border-top: 0; }
  #nowbar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--hubnav-h, 0px) + 84px); z-index: 60; display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 12px 10px 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 8px 30px #0006; }
  #nowbar > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes flash { 50% { background: #1c1838; } }
</style>
</head>
<body style="--c:#9b8cff">
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button" aria-label="New alarm"></button>
<script src="../lib/kit.js"></script>
<script src="../lib/agenda.js"></script>
<script src="../lib/files.js"></script>
<script>
const { esc, svg } = K;
const AL = K.alarms;
let night = null;   /* { lock, ctx, ringing, snoozeUntil, firedId } */

function render() {
  const list = AL.all().sort((a, b) => (K.alarmTime(a, K.ymd()) || a.time || '') < (K.alarmTime(b, K.ymd()) || b.time || '') ? -1 : 1);
  const nx = K.nextAlarm();
  let html = K.header('Alarms', 'alarm');
  html += `<div class="card hl"><div class="k">Next alarm</div>${nx ? `<div class="big num">${K.fmtDay(K.ymd(new Date(nx.at)))} ${K.hm(new Date(nx.at))}</div><div class="muted small">in ${until(nx.at)} · ${esc(nx.a.label || 'Alarm')}${nx.a.smart ? ' · school alarm' : ''}</div>` : `<div class="big">No alarms on</div>`}
    <div class="row-btns" style="margin-top:12px"><button class="btn primary" type="button" data-act="night">🌙 Start night mode</button>${nx ? `<button class="btn" type="button" data-sys="${nx.a.id}">⏰ Set in Clock app</button>` : ''}</div></div>`;
  if (!list.length) html += `<div class="empty"><b>No alarms yet</b>Tap + for a normal alarm, or add a smart school alarm that follows your timetable.<br><br><button class="btn primary" type="button" data-act="school">🎓 Add school alarm</button></div>`;
  else html += `<div class="list">${list.map(a => {
    const d = a.smart ? nextDayWith(a) : null, t = a.smart ? K.alarmTime(a, d) : a.time, mp = a.smart && K.morningPlan(d);
    const how = a.smart ? (mp ? `🚌 ${K.fmtDay(d)}: ${mp.line || 'bus'} ${mp.bus ? mp.bus.stopTime : mp.leave}${mp.earlier ? ` (${mp.earlier} before the last one, ${mp.lastBus})` : ''} · at school ${mp.arrive}` : '🎓 follows your first lesson') : daysText(a.days);
    return `<div class="alarm ${a.on ? '' : 'off'}"><button class="body" type="button" data-edit="${a.id}"><div class="tm">${t || '--:--'}</div><span>${esc(a.label || 'Alarm')} · ${esc(how)}</span></button>
      ${(a.backups ?? 3) ? `<span class="small muted" style="flex:none;text-align:right;line-height:1.3">+${a.backups ?? 3}<br>back-up</span>` : ''}<button class="sw" type="button" role="switch" aria-checked="${!!a.on}" data-tog="${a.id}" aria-label="${a.on ? 'Turn off' : 'Turn on'} ${esc(a.label || 'alarm')}"></button></div>`;
  }).join('')}</div>`;
  html += `<div class="card"><div class="k">How Life Hub alarms work</div><ul class="small muted" style="margin:8px 0 0;padding-left:18px;line-height:1.6">
    <li><b>Night mode</b>: put your phone on the charger with Life Hub open. The screen stays on (very dim), the alarm rings loudly, and your sleep is tracked.</li>
    <li><b>Set in Clock app</b> copies the alarm into your phone’s own alarm clock, which also rings when the phone is locked. Use it as a back-up.</li>
    <li>Without either, you only get a notification, and only if Life Hub is still running in the background.</li></ul>
    <button class="btn sm" type="button" data-act="test" style="margin-top:10px">🔊 Test the beeps</button></div>`;
  const tones = TONES.all();
  html += `<div class="sec">Alarm sounds · ${tones.length}<button class="act" type="button" data-act="addSound">+ Add</button></div>`;
  html += tones.length ? `<div class="list">${tones.map(t => { const u = usedBy(t), bad = !playable(t);
      return `<div class="tone"><span style="font-size:20px">${bad ? '⚠️' : t.kind === 'yt' ? '▶️' : t.kind === 'sp' ? '🟢' : '🎵'}</span><button class="body" type="button" data-tone="${t.id}" style="text-align:left;flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</b><span class="small ${bad ? '' : 'muted'}" style="display:block;${bad ? 'color:var(--bad,#e66)' : ''}">${bad ? STATUS[t.status].replace('⚠️ ', '') + ' · tap to swap' : `${t.start ? '✂️ ' + fmtSec(t.start) + (t.end ? '–' + fmtSec(t.end) : '') : 'from the start'} · ${t.kind === 'yt' ? 'YouTube' : t.kind === 'sp' ? 'Spotify app' : 'file · works offline'}${u.length ? ' · ⏰ ' + esc(u.join(', ')) : ''}`}</span></button>
      <button class="btn sm" type="button" data-play="${t.id}" aria-label="Play ${esc(t.name)}">🔊</button></div>`; }).join('')}</div>
      <div class="row-btns" style="margin:8px 0 14px"><button class="btn sm" type="button" data-act="check">✅ Check songs</button>${tones.length > 1 ? `<button class="btn sm" type="button" data-play="random">🎲 Play a random one</button>` : ''}</div>`
    : `<p class="hint" style="margin:0 2px 12px">Add songs from YouTube or your own sound files, then pick one per alarm. If a song can’t play (no internet), the beeps take over.</p>`;
  K.$('#app').innerHTML = html;
}
function nextDayWith(a) { const now = K.hm(new Date()); for (let i = 0; i < 8; i++) { const d = K.addDays(K.ymd(), i), t = K.alarmTime(a, d); if (t && (i > 0 || t > now)) return d; } return K.ymd(); }   /* the next time it rings, not one that already passed today */
function daysText(d) { d = d || []; if (!d.length) return 'once'; if (d.length === 7) return 'every day'; if ([1, 2, 3, 4, 5].every(x => d.includes(x)) && d.length === 5) return 'weekdays'; if (d.length === 2 && d.includes(0) && d.includes(6)) return 'weekends'; return [1, 2, 3, 4, 5, 6, 0].filter(x => d.includes(x)).map(x => K.DAYS_SHORT[x]).join(', '); }
function until(t) { const m = Math.round((t - Date.now()) / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${K.pad(m % 60)}m`; }

function edit(a, preset) {
  const isNew = !a;
  a = a || Object.assign({ id: K.uid(), time: '07:00', days: [1, 2, 3, 4, 5], label: '', on: true, smart: false, snooze: 9 }, preset || {});
  const f = K.form({
    title: isNew ? (a.smart ? 'School alarm' : 'New alarm') : 'Edit alarm',
    fields: [
      ...(a.smart ? [{ type: 'html', k: '_s', html: `<p class="small muted" style="margin-top:-6px">Looks up the bus that gets you to your first lesson on time (your trip in Travel) and wakes you in time to catch it. Without a connection it rings ${K.sleepCfg().wakeBefore} minutes before your first lesson. Days without school use the time below, or no alarm if it’s empty.</p>` },
        { k: 'ready', label: 'Alarm → on the bus (min)', type: 'number', value: K.morningCfg().ready, half: true, hint: 'At least 60' },
        { k: 'early', label: 'Minutes early at school', type: 'number', value: K.morningCfg().early, half: true, hint: 'Bus arrives before lesson' },
        { k: 'earlier', label: 'Take a bus earlier than the last one that makes it', type: 'seg', value: K.morningCfg().earlier || 'auto', options: [['auto', 'Best fit (2–4)'], ['2', '2 earlier'], ['3', '3 earlier'], ['4', '4 earlier']] },
        { k: 'spare', label: 'Best fit aims for at least … min spare', type: 'number', value: K.morningCfg().spare || 20, hint: 'Picks the closest of the 2–4 earlier buses that gives this much margin' },
        { k: 'bus', label: '🚌 Use real bus times', type: 'checkbox', value: K.morningCfg().bus !== false }] : []),
      { k: 'time', label: a.smart ? 'Time on days without school (optional)' : 'Time', type: 'time', value: a.time, required: !a.smart },
      ...(a.smart ? [] : [{ type: 'html', k: '_d', html: `<div class="f"><label>Repeat on</label><div class="days" data-days>${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" data-d="${d}" aria-pressed="${(a.days || []).includes(d)}">${K.DAYS_SHORT[d].slice(0, 2)}</button>`).join('')}</div><div class="small muted" style="margin-top:4px">No days = rings once.</div></div>` }]),
      { k: 'label', label: 'Label', value: a.label, placeholder: a.smart ? 'School' : 'e.g. Gym, Work' },
      { k: 'sound', label: 'Sound', type: 'select', value: a.sound || 'beep', options: soundOptions() },
      { type: 'html', k: '_snd', html: `<div class="row-btns" style="margin:-4px 0 12px"><button class="btn sm" type="button" data-formtest>🔊 Test</button><button class="btn sm" type="button" data-formyt>+ YouTube song</button></div>` },
      { k: 'fade', label: 'Gets louder over (starts at 40%)', type: 'seg', value: Math.min(15, a.fade ?? 10), options: [[0, 'Loud now'], [5, '5 s'], [10, '10 s'], [15, '15 s'], [90, '1½ min'], [180, '3 min']] },
      { k: 'vol', label: 'Song volume', type: 'seg', value: a.vol || 100, options: [[40, 'Soft'], [70, 'Medium'], [100, 'Full']] },
      { k: 'beepsAfter', label: 'Still asleep? Add beeps after', type: 'seg', value: a.beepsAfter ?? 1, options: [[0, 'Never'], [1, '1 min'], [3, '3 min'], [5, '5 min'], [10, '10 min']] },
      { k: 'backups', label: 'Back-up alarms after it (in case you fall asleep again)', type: 'seg', value: a.backups ?? 3, options: [[0, 'None'], [1, '1'], [2, '2'], [3, '3'], [4, '4']] },
      { k: 'gap', label: 'Minutes between them', type: 'seg', value: a.gap || 10, options: [[5, '5 min'], [10, '10 min'], [15, '15 min']] },
      { k: 'snooze', label: 'Snooze minutes', type: 'number', value: a.snooze || 9, half: true },
      { k: 'on', label: 'On', type: 'checkbox', value: a.on, half: true },
    ],
    save(v) {
      const days = a.smart ? [] : [...f.querySelectorAll('[data-days] [aria-pressed="true"]')].map(b => +b.dataset.d);
      Object.assign(a, { time: v.time, label: v.label, snooze: v.snooze || 9, on: v.on, days, sound: v.sound || 'beep', fade: +v.fade, vol: +v.vol || 100, beepsAfter: +v.beepsAfter, backups: +v.backups, gap: +v.gap || 10 });
      if (a.smart) { const mc = K.morningCfg(), nv = { ready: Math.max(60, v.ready || 60), early: v.early || 0, bus: v.bus, earlier: v.earlier || 'auto', spare: v.spare || 20 };
        if ((v.ready || 60) < 60) K.toast('Set to 60 minutes: the alarm goes at least an hour before your bus.');
        const changed = ['ready', 'early', 'bus', 'earlier', 'spare'].some(x => mc[x] !== nv[x]);
        K.put('morning', Object.assign(mc, nv));
        if (changed) { K.put('mornings', {}); planAhead(true); } }
      if (!a.smart && !days.length) a.once = K.alarmNextOnce(a.time); else delete a.once;
      AL.upsert(a); if (!K.notifyOn()) K.askNotify(); render();
      const nx = K.nextAlarm(); if (nx && nx.a.id === a.id) K.toast(`Alarm in ${until(nx.at)}`);
    },
    del: isNew ? null : () => { AL.remove(a.id); render(); K.toast('Alarm deleted', () => { AL.upsert(a); render(); }); },
  });
  f.addEventListener('click', e => {
    if (e.target.closest('[data-formtest]')) preview(f.elements.sound.value);
    if (e.target.closest('[data-formyt]')) { f.parentElement.remove(); addYouTube(a); }
  });
  const dd = f.querySelector('[data-days]'); if (dd) dd.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); });
}

/* ---------- copy into Android's own Clock app ---------- */
function systemAlarm(a) {
  const t0 = (a.smart ? K.alarmTime(a, nextDayWith(a)) : a.time) || '07:00', n = a.backups ?? 3;
  if (!n) return clockApp(a, t0);
  const [h0, m0] = t0.split(':').map(Number), times = [...Array(n + 1)].map((_, k) => { const x = h0 * 60 + m0 + k * (a.gap || 10); return K.pad(Math.floor(x / 60) % 24) + ':' + K.pad(x % 60); });
  K.form({ title: 'Set them in your Clock app', saveLabel: 'Done', fields: [{ type: 'html', k: 'x', html: `<p class="small muted" style="margin-top:-6px">Tap each one: the Clock app opens with the time filled in. Come back here for the next.</p><div class="list">${times.map((x, k) => `<button class="item" type="button" data-clock="${x}" style="width:100%"><span class="body"><span class="title" style="font-size:20px">${x}</span><span class="meta"><span>${k ? 'Back-up ' + k : 'Main alarm'}</span></span></span><span class="right">Set ›</span></button>`).join('')}</div>` }], save: () => {} })
    .addEventListener('click', e => { const b = e.target.closest('[data-clock]'); if (b) { b.querySelector('.right').textContent = '✓'; clockApp(a, b.dataset.clock); } });
}
function clockApp(a, t) {
  const [h, m] = t.split(':').map(Number);
  const url = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(a.label || 'Life Hub')};B.android.intent.extra.alarm.SKIP_UI=true;end`;
  const before = Date.now(); location.href = url;
  setTimeout(() => { if (document.visibilityState === 'visible' && Date.now() - before < 3000) K.form({ title: 'Set it in your Clock app', saveLabel: 'OK', fields: [{ type: 'html', k: 'x', html: `<p>Your phone didn’t open the Clock app from here. Open <b>Clock</b> yourself and add an alarm for <b style="font-size:20px">${t}</b>${a.smart ? ' (school alarm: check the time each evening, it follows your timetable)' : ''}.</p>` }], save: () => {} }); }, 1500);
}

/* ---------- night mode ---------- */
async function startNight() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
  let lock = null; try { lock = await navigator.wakeLock.request('screen'); } catch {}
  night = { ctx, lock, ringing: false, snoozeUntil: 0, fired: {}, lastCheck: Date.now() };
  /* keep Life Hub awake all night: a sound too quiet to hear keeps Android from pausing the page */
  try { const keep = ctx.createBufferSource(), kb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), kd = kb.getChannelData(0); for (let i = 0; i < kd.length; i++) kd[i] = Math.sin(2 * Math.PI * 25 * i / ctx.sampleRate) * 0.012;   /* 25 Hz: too low for a phone speaker to play, but it counts as sound */
    const kg = ctx.createGain(); kg.gain.value = 1; keep.buffer = kb; keep.loop = true; keep.connect(kg); kg.connect(ctx.destination); keep.start(); night.keep = keep; } catch {}
  /* how loud will it be? one short burst at full alarm volume */
  try { const src = ctx.createBufferSource(); src.buffer = night.alarmBuf = alarmBuffer(ctx); src.connect(ctx.destination); src.start(); src.stop(ctx.currentTime + 0.9); } catch {}
  setTimeout(() => K.form({ title: '🌙 Night mode is on', saveLabel: 'Got it', fields: [{ type: 'html', k: 'x', html: `<ul style="line-height:1.7;padding-left:18px;margin:0">
    <li>That beep was your alarm’s real loudness. Too soft? Turn up the <b>media volume</b> (volume button → the music slider). Life Hub uses that, not the alarm volume.</li>
    <li><b>Don’t lock the phone</b> or switch apps: the screen stays on, very dim. Put it on the <b>charger</b>.</li>
    <li>Keep the <b>Clock app alarms</b> as a back-up (⏰ Set in Clock app).</li></ul>` }], save: () => {} }), 1200);
  if (!K.get('sleep.pending', null)) K.put('sleep.pending', `${K.ymd()}T${K.hm(new Date())}`);
  const el = document.createElement('div'); el.id = 'night';
  el.innerHTML = `<div class="clock" id="nClock"></div><div class="sub" id="nSub"></div>
    <div class="info" id="nInfo"></div>
    <div class="ringbtns"><button class="up" type="button" data-act="up">☀️ I’m up</button><button class="snooze" type="button" data-act="snooze">😴 Snooze</button></div>
    <div class="acts"><button type="button" data-act="awake" class="awakebtn">✅ I’m really awake</button><button type="button" data-act="up" class="upbtn">☀️ I’m up</button><button type="button" data-act="stopNight">Stop night mode</button></div>`;
  document.body.appendChild(el);
  try { await document.documentElement.requestFullscreen(); } catch {}
  prepareYt();
  if (AL.all().some(a => a.on && (TONES.byId(a.sound) || {}).kind === 'sp')) spDevice().then(dv => { if (!dv) K.toast('🟢 Open the Spotify app once (then come back), so your Spotify alarm can start it. Beeps ring if it can’t.'); }).catch(e => K.toast('🟢 ' + e.message + ' Beeps ring as back-up.'));
  tickNight(); night.timer = setInterval(tickNight, 1000);
  planAhead(true); night.planAt = Date.now();
  /* bus changes or cancellations move the alarm: every 2 min in the last 3 hours before a school alarm, otherwise every 30 min */
  night.planner = setInterval(() => { const nx = K.nextAlarm(), soon = nx && nx.a.smart && nx.at - Date.now() < 3 * 36e5;
    if (soon || Date.now() - night.planAt > 30 * 60000) { night.planAt = Date.now(); planAhead(true); } }, 2 * 60000);
  document.addEventListener('visibilitychange', relock);
}
async function relock() { if (night && document.visibilityState === 'visible') { try { night.ctx.resume(); } catch {} tickNight(); if (!night.lock || night.lock.released) { try { night.lock = await navigator.wakeLock.request('screen'); } catch {} } } }
function tickNight() {
  if (!night) return;
  /* look back to the last check, so an alarm is never missed when the phone paused the app for a moment */
  const n = new Date(), nx = K.nextAlarm(Math.min(night.lastCheck, Date.now()) - 1000);
  night.lastCheck = Date.now();
  K.$('#nClock').textContent = K.hm(n);
  const show = nx && nx.at <= Date.now() ? K.nextAlarm() : nx;
  const bl = night.backups && night.backups.i < night.backups.list.length ? night.backups : null;
  K.$('#nSub').textContent = night.ringing ? (night.ringTitle || (night.ringingAlarm || {}).label || 'Wake up!') + (night.song ? ' · ♪ ' + night.song.name : '') : night.wokeAt && bl ? `☀️ Good morning! Fell asleep again? Back-up alarm at ${K.hm(new Date(bl.list[bl.i]))} (${bl.list.length - bl.i} left)` : night.snoozeUntil ? `Snoozing until ${K.hm(new Date(night.snoozeUntil))}` : show ? `⏰ ${K.hm(new Date(show.at))} · in ${until(show.at)}` : 'No alarm set';
  if (night.ringing) { if (n.getSeconds() === 0) showDayInfo(); return; }   /* bus status stays live while it rings */
  const due = night.snoozeUntil ? (Date.now() >= night.snoozeUntil) : (nx && nx.at <= Date.now() && Date.now() - nx.at < 30 * 60000 && !night.fired[nx.key]);
  const bu = night.backups, buDue = bu && bu.i < bu.list.length && Date.now() >= bu.list[bu.i];
  if (buDue) { bu.i++; night.snoozeUntil = 0; ring(bu.a, `Back-up alarm ${bu.i + 1} of ${bu.list.length + 1}`); return; }

  else if (d.act === 'stopNight') stopNight(false);
  else if (d.act === 'up') { const bl = night && night.backups && night.backups.i < night.backups.list.length;
    if (bl) { night.wokeAt = night.wokeAt || Date.now(); stopRing(); K.$('#night').classList.add('awake'); K.toast(`Good morning! ☀️ The back-up alarms stay on in case you fall asleep again. Tap “I’m really awake” to stop them.`); }
    else stopNight(true); }
  else if (d.act === 'awake') stopNight(true);
  else if (d.act === 'snooze') { const m = +((night.ringingAlarm || {}).snooze || 9); stopRing(); night.snoozeUntil = Date.now() + m * 60000; }
  else if (d.act === 'test') testSound();
  else if (d.act === 'addYt') addYouTube();
  else if (d.act === 'addSp') addSpotify();
  else if (d.act === 'addSound') K.form({ title: 'Add an alarm sound', saveLabel: 'Close', fields: [{ type: 'html', k: 'x', html: `<div class="list">${[['addSp', '🟢', 'Spotify', 'Songs or playlists, played in your Spotify app (Premium)'], ['addYt', '▶️', 'YouTube', 'Paste links or a whole playlist'], ['addFile', '🎵', 'Sound file', 'An mp3 on your phone: no ads, works offline']].map(([a, i, t, m]) => `<button class="item" type="button" data-act="${a}" data-closesheet style="width:100%"><span style="font-size:22px">${i}</span><span class="body"><span class="title">${t}</span><span class="meta"><span>${m}</span></span></span></button>`).join('')}</div>` }], save: () => {} });
  else if (d.act === 'addFile') addFile();
  else if (d.play) preview(d.play);
  else if (d.tone) studio(TONES.byId(d.tone));
  else if (d.act === 'check') checkSongs();
  else if ('stopnow' in d) stopTone();
  else if (b.id === 'fab') AL.all().some(a => a.smart) ? edit() : K.form({ title: 'New alarm', saveLabel: 'Close', fields: [{ type: 'html', k: 'x', html: `<div class="list"><button class="item" type="button" data-pickkind="normal" style="width:100%"><span style="font-size:22px">⏰</span><span class="body title">Normal alarm</span></button><button class="item" type="button" data-pickkind="school" style="width:100%"><span style="font-size:22px">🎓</span><span class="body"><span class="title">School alarm</span><span class="meta"><span>Follows your first lesson every day</span></span></span></button></div>` }], save: () => {} });
  else if (d.pickkind) { b.closest('.sheet-bg').remove(); d.pickkind === 'school' ? edit(null, { smart: true, label: 'School', time: '' }) : edit(); }
});
K.$('#fab').innerHTML = svg('plus');
/* work out the next school mornings from the bus times (in the background) */
async function planAhead(force) {
  if (!AL.all().some(a => a.smart && a.on)) return;
  const days = []; for (let i = 0; i < 3; i++) { const d = K.addDays(K.ymd(), i); if (K.lessonsOn(d).length) days.push(d); }
  for (const d of days.slice(0, 2)) await K.planMorning(d, force && K.daysUntil(d) <= 1);
  if (!night) render();
}
render();
planAhead();
fixNames();
/* a song shared from the YouTube app (Share → Life Hub) or a sound file shared from Files */
(async function fromShare() {
  const h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  history.replaceState(null, '', location.pathname);
  if (h.startsWith('addsong=') && spLink(h)) addSpSongs([spLink(h)]);
  else if (h.startsWith('addsong=')) { const link = h.slice(8); const id = ytId(link); if (id) addSongs([{ id, start: ytStart(link) }], []); else addYouTube(null, link); }
  else if (h.startsWith('audio=')) { const fl = await K.files.get(h.slice(6)).catch(() => null); if (fl) { const t = { id: K.uid(), kind: 'file', fileId: fl.id, name: String(fl.name || 'Sound').replace(/\.[a-z0-9]+$/i, '').slice(0, 70), start: 0, status: 'ok', at: Date.now() }; TONES.upsert(t); render(); K.toast('Sound added. Pick the best part ✂️'); studio(t); } }
  else if (h === 'clock') { const nx = K.nextAlarm(); if (nx) systemAlarm(nx.a); }
  else if (h === 'sounds') document.querySelector('[data-act="addSound"]')?.scrollIntoView({ block: 'center' });
})();
setInterval(() => { if (!night && document.visibilityState === 'visible') render(); }, 30000);
</script>
