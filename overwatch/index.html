<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overwatch · Life Hub</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<script src="../hub.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .prof { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px; background: var(--surface) center / cover; border: 1px solid var(--line); position: relative; overflow: hidden; margin-bottom: 12px; }
  .prof::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 55%, transparent)); }
  .prof > * { position: relative; }
  .prof img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
  .prof b { font-size: 20px; display: block; }
  .ranks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .rank { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .rank img { width: 46px; height: 46px; object-fit: contain; display: block; margin: 2px auto; }
  .rank .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .rank .v { font-weight: 800; font-size: 14px; }
  .rank.openq { display: flex; align-items: center; gap: 16px; padding: 14px 18px; margin-bottom: 8px; border-color: color-mix(in srgb, var(--c) 55%, var(--line)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
  .rank.openq img { width: 72px; height: 72px; margin: 0; }
  .wgrid { display: grid; grid-template-columns: 40px 1fr repeat(var(--n), 38px); align-items: center; gap: 6px 6px; padding: 8px 12px; border-top: 1px solid var(--line); }
  .wgrid:first-child { border-top: 0; }
  .wgrid.head { position: sticky; top: 0; background: var(--surface); z-index: 2; font-size: 9.5px; line-height: 1.15; font-weight: 800; color: var(--muted); text-align: center; padding-top: 10px; padding-bottom: 10px; }
  .wgrid.head span { overflow-wrap: anywhere; }
  .wgrid img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
  .wgrid .nm { font-weight: 700; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .wgrid .nm small { display: block; font-weight: 600; font-size: 11.5px; color: var(--muted); }
  .cell { width: 38px; height: 38px; border-radius: 11px; border: 2px solid var(--line); background: transparent; font-weight: 900; font-size: 17px; color: transparent; }
  .cell.own { background: var(--vc); border-color: var(--vc); color: #0d0f14; }
  .cell.na { border-style: dashed; opacity: .35; color: var(--muted); font-size: 14px; }
  .vchips { display: flex; gap: 6px; flex-wrap: wrap; margin: -2px 0 12px; }
  .vchip { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: color-mix(in srgb, var(--vc) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--vc) 45%, transparent); }
  .hero { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .hero:first-child { border-top: 0; }
  .hero img, .hero .ph { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); flex: none; object-fit: cover; }
  .hero .body { flex: 1; min-width: 0; }
  .hero .body b { display: block; }
  .hero .m { font-size: 12.5px; color: var(--muted); }
  .hero .progress { height: 5px; margin-top: 5px; }
  .cnt { min-width: 40px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--surface-2); color: var(--muted); padding: 0 8px; }
  .cnt.on { background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--ct); }
  .role { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .var { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .var:first-child { border-top: 0; }
  .var .own { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); flex: none; font-weight: 800; }
  .var .own[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #0d0f14; }
  .day { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: center; }
  .day:first-child { border-top: 0; }
  .day .d { width: 54px; flex: none; font-weight: 800; }
  .day .d small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
  .wl { font-weight: 800; }
  .wl .w { color: var(--good); } .wl .l { color: var(--bad); }
  #search { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body style="--c:#f99e1a">
<div class="wrap" id="app"></div>
<script src="../lib/kit.js"></script>
<script src="../lib/agenda.js"></script>
<script src="../lib/ow.js"></script>
<script>
const { esc } = K;
const WV = K.coll('owweapons');
const TABS = [['profile', 'Profile'], ['log', 'Game log'], ['seasons', 'Seasons'], ['heroes', 'Heroes'], ['weapons', 'Weapon variants']];
let tab = K.get('ow.tab', 'profile'), mode = K.get('ow.mode', 'competitive'), role = 'all', q = '', data = null, heroes = [], err = '', loading = false;
try { data = JSON.parse(localStorage.getItem('hub.ow.cache') || 'null'); } catch {}
const cfg = () => K.get('ow', {}) || {};
const hrs = s => { const h = s / 3600; return h >= 10 ? Math.round(h) + 'h' : h >= 1 ? h.toFixed(1) + 'h' : Math.round(s / 60) + 'm'; };
const heroBy = k => heroes.find(h => h.key === k) || { key: k, name: OW.cap(k.replace(/-/g, ' ')), role: '' };
const ROLE = { tank: '🛡️ Tank', damage: '⚔️ Damage', support: '➕ Support' };

function render() {
  let html = K.header('Overwatch', 'ow', cfg().tag ? `<button class="iconbtn" type="button" data-act="setup" aria-label="Overwatch settings">${K.svg('gear')}</button>` : '');
  html += `<div class="tabs">${TABS.map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${tab === k}">${l}${k === 'weapons' && heroes.length && counts().own ? `<span class="n">${counts().own}</span>` : ''}</button>`).join('')}</div>`;
  if (tab === 'weapons') html += weaponsHtml();
  else if (!cfg().tag) html += setupHtml();
  else {
    if (err) html += `<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Couldn’t load your stats</b><p class="small muted" style="margin:4px 0 0">${err}</p></div>`;
    if (!data && loading) html += `<div class="empty"><b>Loading your career profile…</b>This can take a few seconds the first time.</div>`;
    else if (data && data.private) html += privateHtml();
    else if (data) html += tab === 'profile' ? profileHtml() : tab === 'log' ? logHtml() : tab === 'seasons' ? seasonsHtml() : heroesHtml();
  }
  K.$('#app').innerHTML = html;
}
function setupHtml() {
  return `<div class="card"><div class="k">Link your Overwatch account</div>
    <p class="small muted" style="margin:6px 0 10px">Blizzard has no official Overwatch API, so Life Hub reads your <b>public career profile</b> (through the free OverFast service) using your BattleTag. No password needed.</p>
    <ol class="steps small"><li>In Overwatch: <b>Options → Social → Career Profile Visibility → Public</b>.</li><li>Type your BattleTag below, e.g. <b>Name#12345</b> (capitals matter).</li></ol>
    <button class="btn primary" type="button" data-act="setup" style="margin-top:8px">Link BattleTag</button></div>
    <p class="hint">Weapon variants work without linking: open that tab.</p>`;
}
function privateHtml() {
  return `<div class="card"><b>Your career profile is private</b><p class="small muted" style="margin:6px 0 10px">Overwatch hides your stats from everyone, Life Hub included. In Overwatch: <b>Options → Social → Career Profile Visibility → Public</b>. Blizzard updates it after you’ve played a game, then come back here.</p>
    <button class="btn" type="button" data-act="refresh">Check again</button></div>`;
}
function stats() { return mode === 'competitive' ? data.comp : data.qp; }
function modeTabs() { return `<div class="seg" style="margin-bottom:12px">${[['competitive', 'Competitive'], ['quickplay', 'Quick Play']].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>`; }
function profileHtml() {
  const s = data.summary || {}, comp = (s.competitive || {}), plat = comp.pc ? 'pc' : comp.console ? 'console' : null, c = plat ? comp[plat] : null;
  let h = `<div class="prof" style="${s.namecard ? `background-image:url('${esc(s.namecard)}')` : ''}">${s.avatar ? `<img onerror="this.style.visibility='hidden'" src="${esc(s.avatar)}" alt="">` : ''}<div><b>${esc(s.username || cfg().tag)}</b><span class="small muted">${esc(s.title || '')}${s.endorsement ? ` · Endorsement ${s.endorsement.level}` : ''}</span></div></div>`;
  if (c) h += `<div class="sec">Competitive rank${c.season ? ` · season ${c.season}` : ''}${comp.pc && comp.console ? ` · ${plat.toUpperCase()}` : ''}</div>
    <div class="rank openq"><div>${c.open ? `<img onerror="this.style.visibility='hidden'" src="${esc(c.open.rank_icon)}" alt="">` : ''}</div><div style="text-align:left"><div class="k">Open Queue</div><div class="v" style="font-size:24px">${c.open ? OW.rankText(c.open) : 'Unranked'}</div>${c.open ? '' : '<div class="small muted">Play your placement matches</div>'}</div></div>
    <div class="ranks">${['tank', 'damage', 'support'].map(r => `<div class="rank"><div class="k">${r}</div>${c[r] ? `<img onerror="this.style.visibility='hidden'" src="${esc(c[r].rank_icon)}" alt=""><div class="v">${OW.rankText(c[r])}</div>` : `<div class="v muted" style="margin:16px 0">Unranked</div>`}</div>`).join('')}</div>`;
  h += modeTabs();
  const st = stats(), g = st && st.general;
  if (!g) return h + `<p class="hint">No ${mode === 'competitive' ? 'competitive' : 'quick play'} games on your profile.</p>`;
  h += `<div class="grid2"><div class="stat"><div class="k">Games</div><div class="v num">${g.games_played}</div><div class="s"><span class="wl"><span class="w">${g.games_won}W</span> · <span class="l">${g.games_lost}L</span></span></div></div>
    <div class="stat"><div class="k">Win rate</div><div class="v num">${Math.round(g.winrate)}<small>%</small></div><div class="s">KDA ${g.kda}</div></div></div>
    <div class="grid2"><div class="stat"><div class="k">Time played</div><div class="v num">${hrs(g.time_played)}</div></div>
    <div class="stat"><div class="k">Per 10 min</div><div class="v num" style="font-size:16px">${g.average.eliminations} elims</div><div class="s">${g.average.deaths} deaths · ${Math.round(g.average.damage)} dmg</div></div></div>`;
  const sm = K.get('owsteam', null), qc = data.platforms ? ['pc', 'console'].reduce((a, p) => a + ((data.platforms[p].qp || {}).tp || 0) + ((data.platforms[p].comp || {}).tp || 0), 0) : 0;
  if (cfg().steam) h += sm && sm.min ? `<div class="grid2"><div class="stat"><div class="k">🎮 Total in game</div><div class="v num">${Math.round(sm.min / 60)}<small> h</small></div><div class="s">Steam${sm.min2w ? ` · ${Math.round(sm.min2w / 6) / 10} h last 2 weeks` : ''}</div></div>
      <div class="stat"><div class="k">Quick Play + Comp</div><div class="v num">${Math.round(qc / 3600)}<small> h</small></div><div class="s">${sm.min * 60 > qc ? `other modes & menus ${Math.round((sm.min * 60 - qc) / 3600)} h` : 'from your career profile'}</div></div></div>${sm.error ? `<p class="small" style="color:var(--bad);margin:-4px 2px 10px">Steam: ${esc(sm.error)}</p>` : ''}`
    : `<p class="small muted" style="margin:0 2px 12px">🎮 Steam hours: ${sm && sm.error ? `<span style="color:var(--bad)">${esc(sm.error)}</span>` : 'waiting for the background job (it checks Steam every 3 hours, once the STEAM_KEY secret is added).'}</p>`;
  else h += `<p class="small muted" style="margin:0 2px 12px">🎮 Want your full Steam hours? Add your Steam profile in ⚙️ (top right).</p>`;
  const P = data.platforms; if (P) { const pt = x => ((x.qp || {}).tp || 0) + ((x.comp || {}).tp || 0), pc = pt(P.pc), co = pt(P.console);
    h += `<p class="small muted" style="margin:-4px 2px 12px">All modes: <b>${fullHM(pc + co)}</b>${pc && co ? ` (PC ${fullHM(pc)} · console ${fullHM(co)})` : co ? ' on console' : ' on PC'}</p>`; }
  const R = st.roles || {};
  h += `<div class="sec">Roles</div><div class="list">${['tank', 'damage', 'support'].filter(r => R[r]).map(r => { const x = R[r]; return `<div class="item"><span class="body"><span class="title">${ROLE[r]}</span><span class="meta"><span>${hrs(x.time_played)}</span><span>${K.plural(x.games_played, 'game')}</span><span>${Math.round(x.winrate)}% wins</span><span>KDA ${x.kda}</span></span></span></div>`; }).join('')}</div>`;
  const top = Object.entries(st.heroes || {}).sort((a, b) => b[1].time_played - a[1].time_played).slice(0, 3);
  if (top.length) h += `<div class="sec">Most played<button class="act" type="button" data-tab="heroes">All heroes</button></div><div class="list">${top.map(heroRow).join('')}</div>`;
  h += `<p class="hint" style="margin-top:12px">Updated ${K.ago ? K.ago(data.at) : new Date(data.at).toLocaleString()}. Blizzard refreshes your profile a while after each game. <button class="act" type="button" data-act="refresh" style="color:var(--ct);font-weight:700">Refresh</button></p>`;
  return h;
}
const fullHM = sec => `${Math.floor(sec / 3600)}h ${K.pad(Math.floor(sec % 3600 / 60))}m`;
let hmode = K.get('ow.hmode', 'all');
/* every hero, Quick Play + Competitive added up (or one of them) */
function heroStats() {
  const pick = m => ((m === 'competitive' ? data.comp : data.qp) || {}).heroes || {};
  if (hmode !== 'all') return Object.entries(pick(hmode)).map(([k, x]) => [k, Object.assign({}, x)]);
  const out = {}, add = (m, k, x) => { const o = out[k] = out[k] || { time_played: 0, games_played: 0, games_won: 0, elim: 0, ast: 0, dth: 0, qp: 0, comp: 0 };
    o.time_played += x.time_played || 0; o.games_played += x.games_played || 0; o.games_won += x.games_won || 0; o[m] += x.time_played || 0;
    const t = x.total || {}; o.elim += t.eliminations || 0; o.ast += t.assists || 0; o.dth += t.deaths || 0; };
  for (const [k, x] of Object.entries(pick('quickplay'))) add('qp', k, x);
  for (const [k, x] of Object.entries(pick('competitive'))) add('comp', k, x);
  return Object.entries(out).map(([k, o]) => [k, Object.assign(o, { winrate: o.games_played ? o.games_won / o.games_played * 100 : 0, kda: o.dth ? ((o.elim + o.ast) / o.dth).toFixed(2) : '–' })]);
}
function heroRow([k, x], i, arr) {
  const hb = heroBy(k), max = arr && arr[0] ? arr[0][1].time_played : x.time_played;
  const split = x.qp != null && x.comp != null ? `<span class="m" style="display:block">Quick Play ${fullHM(x.qp)} · Competitive ${fullHM(x.comp)}</span>` : '';
  return `<div class="hero">${hb.portrait ? `<img onerror="this.style.visibility='hidden'" src="${esc(hb.portrait)}" alt="" loading="lazy">` : '<span class="ph"></span>'}<span class="body"><b>${esc(hb.name)} <span style="float:right;font-variant-numeric:tabular-nums">${fullHM(x.time_played)}</span></b><span class="m">${K.plural(x.games_played, 'game')} · ${Math.round(x.winrate)}% wins · KDA ${x.kda}</span>${split}<span class="progress"><i style="width:${Math.max(3, x.time_played / max * 100)}%"></i></span></span></div>`;
}
function heroesHtml() {
  const list = heroStats().filter(([k]) => role === 'all' || heroBy(k).role === role).filter(([, x]) => x.time_played > 0).sort((a, b) => b[1].time_played - a[1].time_played);
  const total = list.reduce((a, [, x]) => a + x.time_played, 0);
  return `<div class="seg" style="margin-bottom:12px">${[['all', 'All modes'], ['competitive', 'Competitive'], ['quickplay', 'Quick Play']].map(([k, l]) => `<button type="button" data-hmode="${k}" aria-pressed="${hmode === k}">${l}</button>`).join('')}</div>` + roleTabs()
    + (list.length ? `<div class="grid2"><div class="stat"><div class="k">Total time</div><div class="v num">${fullHM(total)}</div><div class="s">${role === 'all' ? 'all roles' : role}</div></div><div class="stat"><div class="k">Heroes played</div><div class="v num">${list.length}</div><div class="s">most: ${esc(heroBy(list[0][0]).name)}</div></div></div><div class="list">${list.map(heroRow).join('')}</div>`
    : `<div class="empty"><b>No heroes here yet</b>Play some games, then refresh.</div>`);
}
/* ---------- competitive seasons, built from your daily saved stats ---------- */
const DIV = ['bronze', 'silver', 'gold', 'platinum', 'diamond', 'master', 'grandmaster', 'champion'];
const rankScore = t => { const m = String(t || '').toLowerCase().match(/^([a-z]+) (\d)$/); return m && DIV.includes(m[1]) ? DIV.indexOf(m[1]) * 5 + (6 - +m[2]) : -1; };
function seasonsHtml() {
  const snaps = K.get('owsnaps', []) || [], cur = (((data || {}).summary || {}).competitive || {}).pc || {};
  const S = {}, get = n => S[n] = S[n] || { n, games: 0, won: 0, lost: 0, tp: 0, first: {}, last: {}, peak: {}, from: '', to: '' };
  snaps.forEach((b, i) => {
    const n = (b.ranks || {}).season || (i ? (snaps[i - 1].ranks || {}).season : 0); if (!n) return;
    const x = get(n); x.from = x.from || b.d; x.to = b.d;
    for (const r of ['open', 'tank', 'damage', 'support']) { const v = (b.ranks || {})[r]; if (!v) continue; if (!x.first[r]) x.first[r] = v; x.last[r] = v; if (rankScore(v) > rankScore(x.peak[r])) x.peak[r] = v; }
    const a = snaps[i - 1]; if (!a || !b.comp || !a.comp || (a.v || 1) !== (b.v || 1)) return;
    const reset = b.comp.gp < a.comp.gp;                                  /* Blizzard started counting again: a new season */
    const d = k => reset ? b.comp[k] : b.comp[k] - a.comp[k];
    x.games += d('gp'); x.won += d('gw'); x.lost += d('gl'); x.tp += d('tp');
  });
  if (cur.season && !S[cur.season]) { const x = get(cur.season); for (const r of ['open', 'tank', 'damage', 'support']) if (cur[r]) x.first[r] = x.last[r] = x.peak[r] = OW.rankText(cur[r]); }
  const list = Object.values(S).sort((a, b) => b.n - a.n);
  let h = `<p class="hint">Blizzard only shows your current season, so Life Hub keeps its own history from the stats it saves every day. It starts from when you linked your BattleTag.</p>`;
  if (!list.length) return h + `<div class="empty"><b>No season data yet</b>Open this page now and then: every day adds to your season history.</div>`;
  return h + list.map(x => { const live = x.n === cur.season, rows = ['open', 'tank', 'damage', 'support'].filter(r => x.last[r]);
    return `<div class="card"><div class="k">Season ${x.n}${live ? ' · <span style="color:var(--ct)">now</span>' : ''}${x.from ? ` · <span class="muted">${K.fmtDay(x.from)} – ${K.fmtDay(x.to)}</span>` : ''}</div>
      ${x.games ? `<div class="grid2" style="margin:10px 0 6px"><div class="stat"><div class="k">Games</div><div class="v num">${x.games}</div><div class="s"><span class="wl"><span class="w">${x.won}W</span> · <span class="l">${x.lost}L</span></span></div></div><div class="stat"><div class="k">Win rate · time</div><div class="v num">${Math.round(x.won / x.games * 100)}<small>%</small></div><div class="s">${fullHM(x.tp)} played</div></div></div>` : `<p class="small muted" style="margin:6px 0">No competitive games logged yet this season.</p>`}
      ${rows.length ? `<div class="list" style="margin:0">${rows.map(r => `<div class="item" style="min-height:0;padding:9px 12px"><span class="body"><span class="title">${r === 'open' ? '⭐ Open Queue' : ROLE[r]}</span><span class="meta"><span>start ${x.first[r]}</span><span>peak <b>${x.peak[r]}</b></span></span></span><span class="right">${x.last[r]}</span></div>`).join('')}</div>` : ''}</div>`; }).join('');
}
function roleTabs() { return `<div class="tabs">${[['all', 'All'], ['tank', 'Tank'], ['damage', 'Damage'], ['support', 'Support']].map(([k, l]) => `<button type="button" data-role="${k}" aria-pressed="${role === k}">${l}</button>`).join('')}</div>`; }
/* game log: what changed between the daily snapshots */
function logHtml() {
  const snaps = K.get('owsnaps', []) || [], key = mode === 'competitive' ? 'comp' : 'qp';
  let h = modeTabs();
  if (snaps.length < 2) return h + `<div class="empty"><b>Your log starts today</b>Life Hub saves your stats every day you open it (any page, every 6 hours) and shows here what changed: games, wins, losses, hours and rank ups and downs.</div>`;
  const rows = [];
  for (let i = snaps.length - 1; i > 0 && rows.length < 60; i--) {
    const a = snaps[i - 1], b = snaps[i], x = a[key], y = b[key]; if (!x || !y || (a.v || 1) !== (b.v || 1)) continue;   /* v2 added console stats: not real games */
    const gp = y.gp - x.gp, gw = y.gw - x.gw, gl = y.gl - x.gl, tp = y.tp - x.tp;
    const rk = Object.keys(b.ranks || {}).filter(r => r !== 'season' && (a.ranks || {})[r] !== b.ranks[r]).map(r => `${OW.cap(r)}: ${(a.ranks || {})[r] || 'unranked'} → <b>${b.ranks[r]}</b>`);
    if (!gp && !rk.length) continue;
    const d = K.fromYmd(b.d);
    rows.push(`<div class="day"><div class="d">${d.getDate()} ${K.MONTHS[d.getMonth()].slice(0, 3)}<small>${K.DAYS_SHORT[d.getDay()]}</small></div><div class="body" style="flex:1"><div class="wl">${gp} game${gp === 1 ? '' : 's'} · <span class="w">${gw}W</span> <span class="l">${gl}L</span>${gp - gw - gl > 0 ? ` · ${gp - gw - gl}D` : ''}</div><div class="small muted">${hrs(tp)} played${gp ? ` · ${Math.round(gw / gp * 100)}% wins` : ''}</div>${rk.length ? `<div class="small" style="margin-top:3px">📈 ${rk.join(' · ')}</div>` : ''}</div></div>`);
  }
  const wk = snaps.filter(s => s.d >= K.addDays(K.ymd(), -7)), first = wk[0] && wk[0][key], last = snaps[snaps.length - 1][key];
  if (first && last) { const gp = last.gp - first.gp, gw = last.gw - first.gw; h += `<div class="grid2"><div class="stat"><div class="k">Last 7 days</div><div class="v num">${gp}<small> games</small></div><div class="s">${gp ? Math.round(gw / gp * 100) + '% wins' : 'no games'}</div></div><div class="stat"><div class="k">Time</div><div class="v num">${hrs(last.tp - first.tp)}</div><div class="s">${mode === 'competitive' ? 'competitive' : 'quick play'}</div></div></div>`; }
  return h + (rows.length ? `<div class="list">${rows.join('')}</div>` : `<div class="empty"><b>No games logged yet</b>Play a few, then check back.</div>`) + `<p class="hint" style="margin-top:10px">Days are grouped by when Life Hub saw the change, so games late at night can show up the next day.</p>`;
}
/* ---------- weapon variants: your own tracker (no API has these) ---------- */
/* ---------- weapon variants: one tap per hero per variant ----------
   hub.owgrid = { heroKey: { Golden: 1 (owned) | -1 (doesn't exist for this hero) } }, variant types in hub.owtypes */
const VCOL = { golden: '#f5c542', jade: '#3fbf8f', galactic: '#8b7cff', 'crimson wolf': '#e5484d', crimson: '#e5484d', wolf: '#c0c6d4' };
const vcol = t => VCOL[t.toLowerCase()] || '#5db3e4';
const types = () => K.get('owtypes', ['Golden', 'Jade', 'Galactic', 'Crimson Wolf']);
const grid = () => K.get('owgrid', {}) || {};
let wshow = 'all';
(function migrate() {   /* variants typed in before the checklist existed */
  if (K.get('owgridv', 0)) return; const g = grid(), T = types();
  for (const v of WV.all()) { const t = T.find(x => x.toLowerCase() === String(v.name).trim().toLowerCase()); if (t && v.owned) { g[v.hero] = g[v.hero] || {}; g[v.hero][t] = 1; WV.remove(v.id); } }
  K.put('owgrid', g); K.put('owgridv', 1);
})();
function counts() {
  const g = grid(), T = types(), per = {}; let own = 0, avail = 0;
  for (const t of T) per[t] = { own: 0, avail: 0 };
  for (const hb of heroes) for (const t of T) { const v = (g[hb.key] || {})[t]; if (v === -1) continue; avail++; per[t].avail++; if (v === 1) { own++; per[t].own++; } }
  return { own, avail, per };
}
function weaponsHtml() {
  const T = types(), g = grid(), c = counts(), other = WV.all().filter(v => v.owned).length;
  let h = `<div class="grid2"><div class="stat"><div class="k">Owned</div><div class="v num">${c.own}<small> / ${c.avail || '–'}</small></div><div class="progress" style="margin-top:6px"><i style="width:${c.avail ? c.own / c.avail * 100 : 0}%"></i></div></div>
    <div class="stat"><div class="k">Still to get</div><div class="v num">${Math.max(0, c.avail - c.own)}</div><div class="s">${c.avail ? Math.round(c.own / c.avail * 100) + '% done' : ''}${other ? ` · +${other} other` : ''}</div></div></div>`;
  h += `<div class="vchips">${T.map(t => `<span class="vchip" style="--vc:${vcol(t)}">${esc(t)} <b>${c.per[t].own}/${c.per[t].avail}</b></span>`).join('')}</div>`;
  h += roleTabs() + `<div class="seg" style="margin-bottom:10px">${[['all', 'All heroes'], ['missing', 'Missing some'], ['done', 'Complete']].map(([k, l]) => `<button type="button" data-wshow="${k}" aria-pressed="${wshow === k}">${l}</button>`).join('')}</div>`;
  h += `<input id="search" type="search" placeholder="Search heroes" value="${esc(q)}" aria-label="Search heroes">`;
  if (!heroes.length) return h + `<div class="empty"><b>Loading heroes…</b>Needs internet the first time.</div>`;
  const full = hb => T.every(t => (g[hb.key] || {})[t]);
  const list = heroes.filter(hb => (role === 'all' || hb.role === role) && (!q || hb.name.toLowerCase().includes(q)) && (wshow === 'all' || (wshow === 'done' ? full(hb) : !full(hb))));
  h += `<p class="hint">Tap a box: <b>✓ owned</b> → <b>— not in the game for this hero</b> → empty. Tap a name for other variants and notes.</p>`;
  h += `<div class="list" style="--n:${T.length}"><div class="wgrid head"><span></span><span style="text-align:left">Hero</span>${T.map(t => `<span style="color:${vcol(t)}">${esc(t)}</span>`).join('')}</div>`;
  h += list.map(hb => { const row = g[hb.key] || {}, o = T.filter(t => row[t] === 1).length, av = T.filter(t => row[t] !== -1).length;
    return `<div class="wgrid"><img onerror="this.style.visibility='hidden'" src="${esc(hb.portrait)}" alt="" loading="lazy"><button class="nm" type="button" data-hero="${hb.key}">${esc(hb.name)}<small>${o}/${av}${WV.all().some(v => v.hero === hb.key) ? ' · +' + WV.all().filter(v => v.hero === hb.key && v.owned).length + ' other' : ''}</small></button>
      ${T.map(t => `<button class="cell ${row[t] === 1 ? 'own' : row[t] === -1 ? 'na' : ''}" type="button" data-cell="${hb.key}|${esc(t)}" style="--vc:${vcol(t)}" aria-label="${esc(hb.name)} ${esc(t)}: ${row[t] === 1 ? 'owned' : row[t] === -1 ? 'not available' : 'missing'}">${row[t] === 1 ? '✓' : row[t] === -1 ? '—' : ''}</button>`).join('')}</div>`; }).join('') + `</div>`;
  h += `<div class="row-btns" style="margin-top:12px"><button class="btn sm" type="button" data-act="types">✏️ Variant types</button></div>`;
  return h;
}
function tapCell(key, t) {
  const g = grid(), row = g[key] = g[key] || {}, v = row[t];
  if (!v) row[t] = 1; else if (v === 1) row[t] = -1; else delete row[t];
  K.put('owgrid', g);
  if (row[t] === 1) { const hb = heroBy(key); if (types().every(x => row[x])) K.toast(`🎉 ${hb.name} complete!`); }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function editTypes() {
  K.form({ title: 'Weapon variant types', fields: [{ k: 't', label: 'One per line (they become the columns)', type: 'textarea', value: types().join('\n'), attrs: 'rows="6"' },
    { type: 'html', k: 'h', html: '<p class="small muted">Add new ones when Overwatch releases them. Removing one hides its column; your ticks stay saved.</p>' }],
    save(v) { const T = [...new Set(v.t.split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 8); if (!T.length) { K.toast('Keep at least one.'); return false; } K.put('owtypes', T); render(); } });
}
function heroSheet(key) {
  const hb = heroBy(key);
  const f = K.form({ title: hb.name + ' · other variants', saveLabel: 'Add',
    fields: [{ type: 'html', k: 'list', html: `<div id="vlist"></div>` },
      { k: 'name', label: 'Add a variant (its name in the game)', placeholder: 'e.g. the variant’s name' },
      { k: 'owned', label: 'I have it (untick = wishlist)', type: 'checkbox', value: true },
      { k: 'note', label: 'Note (optional)', placeholder: 'e.g. from the battle pass, season 18' }],
    save(v) { if (!v.name) { K.toast('Type the variant’s name first.'); return false; }
      WV.upsert({ id: K.uid(), hero: key, name: v.name.slice(0, 60), owned: !!v.owned, note: v.note, got: v.owned ? K.ymd() : '' });
      K.toast(v.owned ? `Added. ${hb.name} has ${WV.all().filter(x => x.hero === key && x.owned).length} now 🎉` : 'Added to your wishlist'); render(); setTimeout(() => heroSheet(key), 250); } });
  const draw = () => { const v = WV.all().filter(x => x.hero === key).sort((a, b) => (b.owned - a.owned) || a.name.localeCompare(b.name));
    f.querySelector('#vlist').innerHTML = v.length ? `<div style="margin-bottom:12px">${v.map(x => `<div class="var"><button class="own" type="button" data-own="${x.id}" aria-pressed="${!!x.owned}" aria-label="${x.owned ? 'Owned' : 'Wanted'}">${x.owned ? '✓' : ''}</button><span style="flex:1;min-width:0"><b>${esc(x.name)}</b><span class="small muted" style="display:block">${x.owned ? 'Owned' + (x.got ? ' since ' + K.fmtDay(x.got) : '') : 'Wishlist'}${x.note ? ' · ' + esc(x.note) : ''}</span></span><button class="btn sm" type="button" data-delv="${x.id}" aria-label="Delete ${esc(x.name)}">✕</button></div>`).join('')}</div>`
      : `<p class="small muted">No variants for ${esc(hb.name)} yet. Add the ones you have (or want) below.</p>`; };
  draw();
  f.addEventListener('click', e => { const o = e.target.closest('[data-own]'), d = e.target.closest('[data-delv]');
    if (o) { const x = WV.byId(o.dataset.own); x.owned = !x.owned; if (x.owned && !x.got) x.got = K.ymd(); WV.upsert(x); draw(); render(); }
    if (d) { const x = WV.byId(d.dataset.delv); if (confirm(`Delete “${x.name}”?`)) { WV.remove(x.id); draw(); render(); } } });
}
function setup() {
  K.form({ title: 'Your Overwatch account', saveLabel: 'Link',
    fields: [{ k: 'tag', label: 'BattleTag', value: cfg().tag || '', placeholder: 'Name#12345', required: true, attrs: 'autocomplete="off" spellcheck="false" autocapitalize="off"', hint: 'Exactly as in Battle.net, capitals included. Your career profile must be Public.' },
      { k: 'steam', label: 'Steam profile (for your total hours)', value: cfg().steam || '', placeholder: 'steamcommunity.com/id/yourname', attrs: 'autocomplete="off" spellcheck="false" autocapitalize="off"', hint: 'Steam → your profile → Share → Copy link. Game details must be Public.' }],
    save(v) { const t = v.tag.trim(); if (!/^[^#\s]{2,}#\d{3,}$/.test(t)) { K.toast('Use the full BattleTag with the number, e.g. Name#12345'); return false; }
      const changed = t !== cfg().tag; K.put('ow', Object.assign(cfg(), { tag: t, steam: (v.steam || '').trim() })); if (changed) { data = null; localStorage.removeItem('hub.ow.cache'); } tab = 'profile'; load(true); },
    del: cfg().tag ? () => { if (!confirm('Unlink your BattleTag? Your game log and weapon variants stay.')) return false; K.put('ow', {}); data = null; localStorage.removeItem('hub.ow.cache'); render(); } : null });
}
async function load(force) {
  if (!cfg().tag || loading) return;
  if (!force && data && data.v === 2 && Date.now() - data.at < 30 * 60000) return;
  loading = true; err = ''; render();
  try { data = await OW.fetchAll(cfg().tag); }
  catch (e) { err = e.code === 404 ? `Overwatch can’t find <b>${esc(cfg().tag)}</b>. Check the BattleTag (capitals and number) and that your career profile is <b>Public</b>. New or just-changed profiles can take a few hours to show up.` : !navigator.onLine ? 'You’re offline.' : esc(e.message); }
  loading = false; render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.tab) { tab = d.tab; K.put('ow.tab', tab); role = 'all'; q = ''; render(); window.scrollTo(0, 0); }
  else if (d.mode) { mode = d.mode; K.put('ow.mode', mode); render(); }
  else if (d.hmode) { hmode = d.hmode; K.put('ow.hmode', hmode); render(); }
  else if (d.role) { role = d.role; render(); }
  else if (d.hero) heroSheet(d.hero);
  else if (d.cell) { const [k, ...t] = d.cell.split('|'); tapCell(k, t.join('|')); }
  else if (d.wshow) { wshow = d.wshow; render(); }
  else if (d.act === 'types') editTypes();
  else if (d.act === 'setup') setup();
  else if (d.act === 'refresh') load(true);
});
document.addEventListener('input', e => { if (e.target.id === 'search') { q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; render(); const s = K.$('#search'); s.focus(); s.setSelectionRange(pos, pos); } });
render();
OW.heroes().then(h => { heroes = h; render(); });
load();
</script>
