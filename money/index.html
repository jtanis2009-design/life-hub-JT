<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money · Life Hub</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<script src="../hub.js" data-private="1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .mhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mhead h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; text-align: center; }
  .in { color: var(--good); }
  .catrow { padding: 10px 14px; border-top: 1px solid var(--line); display: block; width: 100%; text-align: left; }
  .catrow:first-child { border-top: 0; }
  .catrow .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; margin-bottom: 6px; }
  .catrow .top span:last-child { font-variant-numeric: tabular-nums; }
  .progress.over i { background: var(--bad); }
  .stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 10px 0 8px; }
  .stack i { height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); margin-right: 5px; }
</style>
</head>
<body style="--c:#3ecf9a">
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button" aria-label="Add"></button>
<script src="../lib/kit.js"></script>
<script src="../lib/agenda.js"></script>
<script src="../lib/files.js"></script>
<script src="../lib/bankimport.js"></script>
<script>
const { esc, svg, eur } = K;
const OUT = [['Food & drinks', '🍔', /kebab|mcdonald|\bmc ?d|burger|pizza|domino|new york pizza|snack|lunch|döner|doner|subway|kfc|frites|patat|coffee|koffie|starbucks|monster|red ?bull|drink|broodje|food|eten|thuisbezorgd|uber ?eats|deliveroo|febo|smullers|wok|sushi|restaurant|cafetaria|bakker|kiosk|hema|candy|snoep|chicken|oriental|ladage|\bdino\b|pizzeria|döner|kapsalon|bubble ?tea|ice ?cream|ijssalon|tabak|gemakswinkel/i],
  ['Groceries', '🛒', /albert heijn|\bah\b|ah to go|jumbo|lidl|aldi|rewe|edeka|carrefour|delhaize|colruyt|\bplus\b|dirk|grocer|boodschap|spar\b|coop\b|picnic|vomar|hoogvliet|deen|dekamarkt|poiesz|ekoplaza|crisp|supermarkt|dagwinkel|toko|amazing oriental/i],
  ['Transport', '🚌', /\bbus\b|\bov\b|ov-?chip|ns\b|ns groep|ns reizigers|train|trein|metro|\bret\b|arriva|connexxion|qbuzz|keolis|ebs|htm|gvb|fiets|bike|swapfiets|ovpay|trans link|de lijn|\bnmbs|\bsncb|flixbus|benzine|fuel|shell|esso|bp\b|tinq|tango|uber\b|bolt\b|parkeer|parking/i],
  ['Going out', '🎉', /cinema|bios|pathé|pathe|vue\b|kinepolis|party|feest|club|bowling|concert|ticket|ticketmaster|eventim|festival|escape|lasergame|blijdorp|diergaarde|jump ?xl|efteling|walibi|zoo\b|museum|trampoline|karting/i],
  ['Clothes', '👕', /shirt|shoes|schoen|jacket|jas|broek|pants|hoodie|zara|h&m|h & m|nike|adidas|kleding|primark|jd sports|zalando|about you|snipes|foot ?locker|we fashion|c&a|only\b|jack ?& ?jones|bershka|pull ?& ?bear|uniqlo|vinted|new ?yorker|bershka|scotch|livera|hunkemöller/i],
  ['Gaming', '🎮', /game|steam|valve|psn|playstation|sony interactive|xbox|microsoft\*xbox|nintendo|fortnite|epic games|v-?bucks|robux|roblox|riot|blizzard|ea\.com|gamemania|g2a|instant gaming|twitch|xsolla|pgsharp|codashop|razer|supercell/i],
  ['Subscriptions', '📱', /spotify|netflix|disney|youtube|abonnement|subscription|icloud|apple\.com|google \*|google play|prime video|amazon prime|videoland|chatgpt|openai|discord|snapchat|duolingo|lebara|lyca|simyo|ben\b|odido|t-mobile|kpn|vodafone|youfone/i],
  ['Gym & health', '💪', /gym|basic.?fit|sportcity|fit ?for ?free|anytime fitness|trainmore|protein|whey|creatine|supplement|myprotein|bodyandfit|body & fit|xxl nutrition|etos|kruidvat|trekpleister|apotheek|pharmacy/i],
  ['School', '📚', /book|boek|bruna|school|pen\b|schrift|laptop|printer|grafisch lyceum|studiegeld|lesgeld|duo\b|canon|adobe/i],
  ['Shopping', '🛍️', /bol\.com|\bbol\b|amazon|coolblue|mediamarkt|action\b|blokker|ikea|aliexpress|temu|shein|wish\b|marktplaats|apple store|alternate|megekko|azerty|miniso|normal\b|fruugo|alipay|praxis|gamma|hornbach|flying tiger|xenos|søstrene|sostrene/i],
  ['Gifts', '🎁', /gift|cadeau|present|bloemen|flowers|intertoys|lego/i],
  ['Tikkie & friends', '🤝', /tikkie|betaalverzoek|terugbetaling|lend|geleend/i],
  ['Cash', '💶', /\batm\b|geldautomaat|geldopname|opname|cash/i],
  ['Other', '💸', /$^/]];
const IN = [['Job', '💼', /salary|salaris|loon|job|werk|shift|uitzend|randstad|tempo.?team|youngcapital|olympia|start people|payroll|nettoloon|vakantiegeld/i], ['Pocket money', '👛', /pocket|zakgeld|kleedgeld|kostgeld/i],
  ['Gift', '🎁', /gift|cadeau|birthday|verjaardag|sinterklaas|kerst/i], ['Sold something', '🏷️', /sold|verkocht|marktplaats|vinted|ebay/i], ['Refund', '↩️', /refund|retour|terugbetaling|restitutie|terugstorting|creditnota/i],
  ['Tikkie & friends', '🤝', /tikkie|betaalverzoek/i], ['Other', '💰', /$^/]];
const catOf = (list, text) => (list.find(c => c[2].test(text)) || list[list.length - 1])[0];
/* categories you corrected are remembered per shop/person and used next time */
const partyKey = n => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
function catFor(type, name, desc) {
  const rules = K.get('money.rules', {}) || {}, r = rules[type + ':' + partyKey(name)];
  if (r && (type === 'in' ? IN : OUT).some(c => c[0] === r)) return r;
  return catOf(type === 'in' ? IN : OUT, (name || '') + ' ' + (desc || ''));
}
function learn(t) { if (!t.party) return; const rules = K.get('money.rules', {}) || {}; rules[t.type + ':' + partyKey(t.party)] = t.cat; K.put('money.rules', rules); }
const receiptFor = id => K.receipts.all().find(r => r.txId === id);
const emo = (type, c) => ((type === 'in' ? IN : OUT).find(x => x[0] === c) || ['', '💸'])[1];
const COLORS = ['#3ecf9a', '#56ccf2', '#8b7cff', '#f25f8a', '#ffcf5c', '#f2994a', '#ff7b7b', '#b48cff', '#5db3e4', '#c9b37e', '#9097a8'];
const TABS = [['month', 'Month'], ['year', 'Year'], ['receipts', 'Receipts'], ['budgets', 'Budgets'], ['savings', 'Savings'], ['subs', 'Subscriptions']];
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'month';
let ym = K.ymd().slice(0, 7);

function monthTx(m = ym) { return K.money.all().filter(t => String(t.date).slice(0, 7) === m); }
function render() {
  let html = K.header('Money', 'money') + `<div class="tabs">${TABS.map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>`;
  html += ({ month: monthHtml, year: yearHtml, receipts: receiptsHtml, budgets: budgetsHtml, savings: savingsHtml, subs: subsHtml })[tab]();
  if (tab === 'receipts') loadThumbs();
  K.$('#app').innerHTML = html;
}

/* ---------- month ---------- */
function monthHtml() {
  const tx = monthTx(), [y, m] = ym.split('-').map(Number);
  const out = tx.filter(t => t.type !== 'in').reduce((a, t) => a + K.num(t.amount), 0), inn = tx.filter(t => t.type === 'in').reduce((a, t) => a + K.num(t.amount), 0);
  let html = `<form class="quick" id="quick" autocomplete="off"><input id="q" placeholder="5,50 kebab  ·  +20 pocket money" aria-label="Quick add spending or income" inputmode="text"><button class="btn primary" type="submit" aria-label="Add">${svg('plus', 'width="18" height="18"')}</button></form>
    <div class="mhead"><button class="iconbtn" type="button" data-m="-1" aria-label="Previous month">${svg('left')}</button><h2>${K.MONTHS[m - 1]} ${y}</h2><button class="iconbtn" type="button" data-m="1" aria-label="Next month">${svg('right')}</button></div>
    <div class="row-btns" style="margin:-2px 0 12px"><button class="btn sm" type="button" data-act="import">🏦 Import from bank</button><button class="btn sm" type="button" data-act="addReceipt">🧾 Add receipt</button>${lastImport()}</div>${autoBankLine()}
    <div class="grid2"><div class="stat"><div class="k">Spent</div><div class="v num">${eur(out)}</div><div class="s">${tx.filter(t => t.type !== 'in').length} payments</div></div>
    <div class="stat"><div class="k">Came in</div><div class="v num in">${eur(inn)}</div><div class="s">${inn - out >= 0 ? 'Left over ' + eur(inn - out) : 'Short ' + eur(out - inn)}</div></div></div>`;
  if (out) {
    const by = {}; tx.filter(t => t.type !== 'in').forEach(t => by[t.cat] = (by[t.cat] || 0) + K.num(t.amount));
    const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
    html += `<div class="card"><div class="k">Where it went</div><div class="stack">${cats.map(([c, v], i) => `<i style="width:${v / out * 100}%;background:${COLORS[i % COLORS.length]}" title="${esc(c)}"></i>`).join('')}</div>
      <div class="legend">${cats.map(([c, v], i) => `<span style="--dot:${COLORS[i % COLORS.length]}">${esc(c)} ${eur(v)}</span>`).join('')}</div></div>`;
  }
  if (!tx.length) return html + `<div class="empty"><b>Nothing logged in ${K.MONTHS[m - 1]}</b>Type an amount and what it was for, like <b>4,20 lunch</b>. Put a + in front for money that came in, like <b>+20 pocket money</b>.</div>`;
  const days = {}; tx.forEach(t => (days[t.date] = days[t.date] || []).push(t));
  for (const d of Object.keys(days).sort().reverse()) {
    const sum = days[d].reduce((a, t) => a + (t.type === 'in' ? 1 : -1) * K.num(t.amount), 0);
    html += `<div class="sec">${esc(K.fmtDay(d, true))}<span class="act num" style="color:var(--muted)">${sum >= 0 ? '+' : '−'}${eur(Math.abs(sum))}</span></div><div class="list">${days[d].map(txRow).join('')}</div>`;
  }
  return html;
}
function txRow(t) {
  return `<button class="item" type="button" data-tx="${t.id}" style="width:100%"><span style="font-size:20px;width:26px;text-align:center">${emo(t.type, t.cat)}</span>
    <span class="body"><span class="title">${esc(t.note || t.party || t.cat)}</span><span class="meta"><span>${esc(t.cat)}</span>${receiptFor(t.id) ? '<span>🧾 receipt</span>' : ''}${t.src === 'bank' ? '<span>🏦</span>' : ''}</span></span>
    <span class="right num ${t.type === 'in' ? 'in' : ''}">${t.type === 'in' ? '+' : '−'}${eur(t.amount)}</span></button>`;
}
function quickAdd(text) {
  const m = text.trim().match(/^([+-]?)\s*€?\s*(\d+(?:[.,]\d{1,2})?)\s*(.*)$/) || text.trim().match(/^(.*?)\s*([+-]?)\s*€?\s*(\d+(?:[.,]\d{1,2})?)$/);
  if (!m) { K.toast('Start with the amount, e.g. 4,20 lunch'); return false; }
  let sign, amount, note;
  if (/^\d|^[+-]/.test(text.trim()) || text.trim().startsWith('€')) { sign = m[1]; amount = K.num(m[2]); note = m[3]; } else { note = m[1]; sign = m[2]; amount = K.num(m[3]); }
  if (!(amount > 0)) { K.toast('That amount isn’t right'); return false; }
  note = (note || '').trim();
  const type = sign === '+' || /^(pocket money|zakgeld|salary|salaris|loon)/i.test(note) ? 'in' : 'out';
  const t = K.money.upsert({ id: K.uid(), type, amount, note, cat: catFor(type, note), date: ym === K.ymd().slice(0, 7) ? K.ymd() : ym + '-01' });
  checkBudget(t);
  return true;
}
function checkBudget(t) {
  if (t.type === 'in') return K.toast(`+${eur(t.amount)} added`);
  const b = K.num((K.get('budgets', {}) || {})[t.cat]);
  if (!b) return K.toast(`${eur(t.amount)} · ${t.cat}`);
  const used = monthTx(t.date.slice(0, 7)).filter(x => x.type !== 'in' && x.cat === t.cat).reduce((a, x) => a + K.num(x.amount), 0);
  K.toast(used > b ? `⚠️ Over your ${t.cat} budget by ${eur(used - b)}` : used > b * .8 ? `Careful: ${eur(b - used)} left for ${t.cat}` : `${eur(b - used)} left for ${t.cat} this month`);
}
function editTx(t, type) {
  const isNew = !t;
  t = t || { id: K.uid(), type: type || 'out', amount: '', note: '', cat: '', date: ym === K.ymd().slice(0, 7) ? K.ymd() : ym + '-01' };
  const cats = () => (t.type === 'in' ? IN : OUT).map(c => [c[0], c[1] + ' ' + c[0]]);
  const f = K.form({
    title: isNew ? (t.type === 'in' ? 'Money in' : 'Spent') : 'Edit',
    fields: [
      { k: 'type', label: 'Type', type: 'seg', value: t.type, options: [['out', 'Spent'], ['in', 'Money in']] },
      { k: 'amount', label: 'Amount (€)', type: 'number', value: t.amount, required: true, half: true },
      { k: 'date', label: 'Date', type: 'date', value: t.date, half: true },
      { k: 'note', label: 'What for', value: t.note },
      { k: 'cat', label: 'Category', type: 'select', value: t.cat || cats()[0][0], options: cats() },
      ...(t.party && t.party !== t.note ? [{ type: 'html', k: '_p', html: `<p class="small muted" style="margin:-4px 0 10px">From your bank: ${esc(t.party)}${t.desc ? ' · ' + esc(t.desc) : ''}</p>` }] : []),
      ...(isNew ? [] : [{ type: 'html', k: '_r', html: receiptFor(t.id) ? `<button class="btn block" type="button" data-openr="${receiptFor(t.id).id}" style="margin-bottom:6px">🧾 View receipt</button>` : `<button class="btn block" type="button" data-attach="${t.id}" style="margin-bottom:6px">🧾 Attach a receipt</button>` }]),
    ],
    change(v, form) {
      if (v.type !== t.type) { t.type = v.type; form.elements.cat.innerHTML = cats().map(([a, b]) => `<option value="${esc(a)}">${esc(b)}</option>`).join(''); }
      if (isNew && v.note && document.activeElement === form.elements.note) form.elements.cat.value = catOf(t.type === 'in' ? IN : OUT, v.note);
    },
    save(v) { if (!(v.amount > 0)) { K.toast('Fill in an amount'); return false; } const catChanged = t.cat && t.cat !== v.cat; Object.assign(t, v); K.money.upsert(t); if (catChanged) { learn(t); if (t.party) K.toast(`Got it: ${t.party} is ${t.cat} from now on`); } render(); if (isNew) checkBudget(t); },
    del: isNew ? null : () => { K.money.remove(t.id); const r = receiptFor(t.id); if (r) { r.txId = ''; K.receipts.upsert(r); } render(); K.toast('Deleted', () => { K.money.upsert(t); render(); }); },
  });
  f.addEventListener('click', e => { const b = e.target.closest('[data-attach],[data-openr]'); if (!b) return; f.parentElement.remove(); if (b.dataset.attach) pickReceipt(t.id); else editReceipt(K.receipts.byId(b.dataset.openr)); });
}

/* ---------- year ---------- */
let yr = K.ymd().slice(0, 4);
function yearHtml() {
  const all = K.money.all(), years = [...new Set(all.map(t => String(t.date).slice(0, 4)).filter(Boolean))].sort();
  if (!years.includes(yr)) years.push(yr);
  const tx = all.filter(t => String(t.date).slice(0, 4) === yr), out = tx.filter(t => t.type !== 'in'), inn = tx.filter(t => t.type === 'in');
  const sum = l => l.reduce((a, t) => a + K.num(t.amount), 0);
  const sOut = sum(out), sIn = sum(inn);
  let html = `<div class="mhead"><button class="iconbtn" type="button" data-yr="-1" aria-label="Previous year" ${years[0] >= yr ? 'disabled style="opacity:.3"' : ''}>${svg('left')}</button><h2>${yr}</h2><button class="iconbtn" type="button" data-yr="1" aria-label="Next year" ${yr >= K.ymd().slice(0, 4) ? 'disabled style="opacity:.3"' : ''}>${svg('right')}</button></div>`;
  if (!tx.length) return html + `<div class="empty"><b>Nothing in ${yr}</b>Import your bank statement to see your year.</div>`;
  const months = [...new Set(tx.map(t => String(t.date).slice(0, 7)))].length;
  html += `<div class="grid2"><div class="stat"><div class="k">Came in</div><div class="v num in">${eur(sIn)}</div><div class="s">${eur(sIn / months)} a month</div></div>
    <div class="stat"><div class="k">Spent</div><div class="v num">${eur(sOut)}</div><div class="s">${eur(sOut / months)} a month</div></div></div>
    <div class="card"><div class="k">${sIn >= sOut ? 'Kept' : 'Short'} this year</div><div class="big num" style="color:${sIn >= sOut ? 'var(--good)' : 'var(--bad)'}">${eur(Math.abs(sIn - sOut))}</div><div class="muted small">${sIn ? Math.round((sIn - sOut) / sIn * 100) : 0}% of what came in · ${K.plural(tx.length, 'payment')} in ${K.plural(months, 'month')}</div></div>`;
  /* per month bars */
  const per = Array.from({ length: 12 }, (_, i) => { const m = `${yr}-${K.pad(i + 1)}`, l = tx.filter(t => String(t.date).slice(0, 7) === m); return { m, i: sum(l.filter(t => t.type === 'in')), o: sum(l.filter(t => t.type !== 'in')) }; });
  const max = Math.max(1, ...per.map(p => Math.max(p.i, p.o)));
  html += `<div class="card"><div class="k">Per month · <span style="color:var(--good)">in</span> / <span style="color:var(--bad)">out</span></div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px">${per.map(p => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end" title="${p.m}: in ${eur(p.i)}, out ${eur(p.o)}"><div style="display:flex;gap:1px;align-items:flex-end;width:100%;justify-content:center;height:calc(100% - 15px)"><i style="width:45%;max-width:10px;border-radius:3px 3px 1px 1px;background:var(--good);height:${p.i / max * 100}%;min-height:${p.i ? 2 : 0}px"></i><i style="width:45%;max-width:10px;border-radius:3px 3px 1px 1px;background:var(--bad);opacity:.85;height:${p.o / max * 100}%;min-height:${p.o ? 2 : 0}px"></i></div><span style="font-size:10px;color:var(--muted-2);font-weight:700">${K.MONTHS[+p.m.slice(5) - 1][0]}</span></div>`).join('')}</div></div>`;
  /* categories */
  const cats = {}; out.forEach(t => cats[t.cat] = (cats[t.cat] || 0) + K.num(t.amount));
  const cl = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  html += `<div class="card"><div class="k">Where it went</div><div class="stack">${cl.map(([c, v], i) => `<i style="width:${v / sOut * 100}%;background:${COLORS[i % COLORS.length]}"></i>`).join('')}</div>
    <div class="legend">${cl.map(([c, v], i) => `<span style="--dot:${COLORS[i % COLORS.length]}">${esc(c)} ${eur(v)} (${Math.round(v / sOut * 100)}%)</span>`).join('')}</div></div>`;
  /* income sources */
  const src = {}; inn.forEach(t => src[t.cat] = (src[t.cat] || 0) + K.num(t.amount));
  html += `<div class="sec">Where it came from</div><div class="list">${Object.entries(src).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="item"><span style="font-size:20px;width:26px;text-align:center">${emo('in', c)}</span><span class="body title">${esc(c)}</span><span class="right num in">${eur(v)}</span></div>`).join('')}</div>`;
  const job = per.map(p => ({ m: p.m, v: sum(inn.filter(t => t.cat === 'Job' && String(t.date).slice(0, 7) === p.m)) })).filter(x => x.v);
  if (job.length) { const best = job.slice().sort((a, b) => b.v - a.v)[0]; html += `<p class="hint">💼 Work: ${eur(sum(inn.filter(t => t.cat === 'Job')))} this year, ${eur(sum(inn.filter(t => t.cat === 'Job')) / job.length)} a month on average. Best month: ${K.MONTHS[+best.m.slice(5) - 1]} (${eur(best.v)}).</p>`; }
  /* places & biggest */
  const places = {}; out.forEach(t => { const k = (t.party || t.note || t.cat).replace(/\s+\d+$/, ''); const p = places[k] = places[k] || { n: 0, v: 0 }; p.n++; p.v += K.num(t.amount); });
  html += `<div class="sec">Top places</div><div class="list">${Object.entries(places).sort((a, b) => b[1].v - a[1].v).slice(0, 10).map(([n, p], i) => `<div class="item"><b style="width:20px;color:var(--muted)">${i + 1}</b><span class="body"><span class="title">${esc(n)}</span><span class="meta"><span>${p.n}×</span></span></span><span class="right num">${eur(p.v)}</span></div>`).join('')}</div>`;
  html += `<div class="sec">Biggest buys</div><div class="list">${out.slice().sort((a, b) => K.num(b.amount) - K.num(a.amount)).slice(0, 5).map(txRow).join('')}</div>`;
  return html;
}

/* ---------- budgets ---------- */
function budgetsHtml() {
  const b = K.get('budgets', {}) || {}, tx = monthTx(K.ymd().slice(0, 7)).filter(t => t.type !== 'in');
  const day = new Date().getDate(), dim = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();

/* ================= automatic bank sync =================
   A private GitHub job (life-hub-bank) puts new Rabobank payments in your Life Hub cloud
   (the Firebase account you log in with in Workout): users/{uid}/bank. Picked up here. */
const FB = { key: 'AIzaSyDYVE8Uk3s277R3fYXH3adm6w_HMnS3EPE', docs: 'https://firestore.googleapis.com/v1/projects/workout-log-jasontanis/databases/(default)/documents' };
let bankMeta = K.get('bank.meta', null), bankBusy = false;
function autoBankLine() {
  const m = bankMeta;
  if (!m || !m.session) return '';
  const left = m.validUntil ? Math.floor((Date.parse(m.validUntil) - Date.now()) / 864e5) : null;
  const last = m.lastSync ? Math.round((Date.now() - Date.parse(m.lastSync)) / 36e5) : null;
  if (m.error === 'expired' || (left != null && left < 0)) return `<div class="card" style="border-color:var(--bad);padding:10px 14px;margin-bottom:12px"><b style="color:var(--bad)">🏦 Bank access ended</b><div class="small muted">Renew it: GitHub → life-hub-bank → Actions → <b>Connect bank</b> → Run workflow.</div></div>`;
  return `<p class="small muted" style="margin:-4px 2px 12px">🏦 Automatic: ${last == null ? 'waiting for the first sync' : last < 1 ? 'updated less than an hour ago' : `updated ${last} h ago`}${left != null ? ` · access for ${left} more day${left === 1 ? '' : 's'}` : ''}${left != null && left <= 14 ? ' · <b style="color:var(--warn)">renew soon</b>' : ''}</p>`;
}
async function fbToken() {
  const a = K.raw('wl_auth', null); if (!a || !a.rt) return null;
  if (a.it && Date.now() < a.exp - 60000) return { uid: a.uid, tok: a.it };
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + FB.key, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.rt) });
  if (!r.ok) return null;
  const d = await r.json(); a.it = d.id_token; a.rt = d.refresh_token || a.rt; a.exp = Date.now() + (+d.expires_in || 3600) * 1000;
  try { localStorage.setItem('wl_auth', JSON.stringify(a)); } catch {}
  return { uid: a.uid, tok: a.it };
}
async function pullBank() {
  if (bankBusy) return; bankBusy = true;
  try {
    const t = await fbToken(); if (!t) return;
    const H = { Authorization: 'Bearer ' + t.tok, 'Content-Type': 'application/json' };
    const mr = await fetch(`${FB.docs}/users/${t.uid}/bankmeta/state`, { headers: H });
    if (!mr.ok) return;                                   /* not connected (yet) */
    const mj = await mr.json(); bankMeta = mj.fields && mj.fields.j ? JSON.parse(mj.fields.j.stringValue) : null; K.put('bank.meta', bankMeta);
    let cur = K.get('bank.cursor', ''), got = [];
    for (let page = 0; page < 20; page++) {
      const q = { from: [{ collectionId: 'bank' }], orderBy: [{ field: { fieldPath: 's' }, direction: 'ASCENDING' }], limit: 300 };
      if (cur) q.where = { fieldFilter: { field: { fieldPath: 's' }, op: 'GREATER_THAN', value: { timestampValue: cur } } };
      const r = await fetch(`${FB.docs}/users/${t.uid}:runQuery`, { method: 'POST', headers: H, body: JSON.stringify({ structuredQuery: q }) });
      if (!r.ok) break;
      const rows = (await r.json()).filter(x => x.document);
      for (const x of rows) { const f = x.document.fields; if (f.j) got.push(JSON.parse(f.j.stringValue)); if (f.s) cur = f.s.timestampValue; }
      if (rows.length < 300) break;
    }
    const added = got.length ? mergeBank(got) : 0;
    K.put('bank.cursor', cur);
    if (added) K.toast(`🏦 ${added} new payment${added > 1 ? 's' : ''} from your bank`);
    render();
  } catch {} finally { bankBusy = false; }
}
/* add bank payments that aren't in Life Hub yet. Already there = same direction and amount within 3 days
   (from a PDF/CSV import or typed in yourself); each existing payment can only match once. */
function mergeBank(items) {
  const list = K.money.all(), own = new Set((K.get('money.ownIbans', []) || []).map(x => x.toUpperCase()));
  const seen = new Set(list.map(t => t.eb).filter(Boolean)), skipped = new Set(K.get('bank.skipped', []) || []);
  const free = list.filter(t => !t.eb);
  let n = 0;
  for (const it of items.sort((a, b) => a.date < b.date ? -1 : 1)) {
    if (seen.has(it.id) || skipped.has(it.id)) continue;
    const c = K.bank.clean(it.party, it.desc);
    const tx = { date: it.date, amount: it.amount, type: it.type, name: c.name, desc: c.desc, counter: it.counter || '' };
    if (K.bank.isTransfer(tx, own)) { skipped.add(it.id); continue; }
    const i = free.findIndex(t => t.type === it.type && Math.abs(K.num(t.amount) - it.amount) < 0.005 && Math.abs(K.daysUntil(t.date) - K.daysUntil(it.date)) <= 3);
    if (i >= 0) { free[i].eb = it.id; free.splice(i, 1); seen.add(it.id); continue; }
    list.push(K.stamp({ id: K.uid(), type: it.type, amount: it.amount, date: it.date, note: c.name, party: c.name, desc: c.desc, cat: catFor(it.type, c.name, c.desc), src: 'bank', eb: it.id, bank: K.bank.key(tx), created: Date.now() }));
    seen.add(it.id); n++;
  }
  K.money.save(list); K.put('bank.skipped', [...skipped].slice(-3000));
  return n;
}

  for (const el of document.querySelectorAll('[data-thumb]')) { const id = el.dataset.thumb; if (!id) continue; const u = await K.files.thumb(id); if (u) { el.style.backgroundImage = `url(${u})`; el.textContent = ''; } }
  const u = await K.files.usage(), el = K.$('#rusage');
  if (el) { const n = K.receipts.all().length; el.textContent = `${K.plural(n, 'receipt')} saved on this phone${u && u.usage ? ` · Life Hub uses ${K.fmtSize(u.usage)}` : ''}. Receipts are in your backup file too.`; }
}
async function pickReceipt(txId, photo) {
  const files = await pickFile('application/pdf,image/*', photo, !txId);
  if (!files.length) return;
  K.files.keep();
  for (const file of files) {
    const fileId = await K.files.put(file, file.name);
    const r = { id: K.uid(), fileId, fileName: file.name, type: file.type, size: file.size, shop: guessShop(file.name), date: K.ymd(new Date(file.lastModified || Date.now())), amount: '', txId: txId || '', note: '', warranty: '' };
    K.receipts.upsert(r);
    if (files.length === 1) { editReceipt(r, null, true); }
  }
  if (files.length > 1) K.toast(`${files.length} receipts saved. Tap one to add details.`);
  tab = tab === 'month' && txId ? 'month' : 'receipts'; render();
}
function guessShop(name) {
  const n = String(name || '').replace(/\.[a-z0-9]+$/i, '').replace(/[_-]+/g, ' ').replace(/\b(invoice|factuur|receipt|bon|order|bestelling|bevestiging|confirmation|screenshot|img|scan|pdf)\b/gi, '').replace(/\d{4,}/g, '').trim();
  return n.length > 2 ? n.slice(0, 40) : '';
}
function editReceipt(r, preset, isNewFile) {
  const isNew = !r;
  r = r || Object.assign({ id: K.uid(), fileId: '', url: '', shop: '', date: K.ymd(), amount: '', txId: '', note: '', warranty: '' }, preset || {});
  const near = K.money.all().filter(t => t.type !== 'in' && (!r.date || Math.abs(K.daysUntil(t.date) - K.daysUntil(r.date)) <= 30)).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 60);
  const txOpts = [['', '— Not linked —']].concat(near.map(t => [t.id, `${K.fmtDay(t.date)} · ${t.note || t.party || t.cat} · ${eur(t.amount)}`]));
  if (r.txId && !near.some(t => t.id === r.txId)) { const t = K.money.byId(r.txId); if (t) txOpts.push([t.id, `${K.fmtDay(t.date)} · ${t.note || t.cat} · ${eur(t.amount)}`]); }
  const f = K.form({
    title: isNew ? (r.fileId ? 'New receipt' : 'Add a receipt link') : 'Receipt',
    fields: [
      ...(r.fileId ? [{ type: 'html', k: '_f', html: `<div class="row-btns" style="margin:-4px 0 12px"><button class="btn sm primary" type="button" data-ropen>Open ${/pdf/i.test(r.type || '') ? 'PDF' : 'file'}</button><button class="btn sm" type="button" data-rdl>Download</button><span class="small muted" style="align-self:center">${esc(r.fileName || '')}${r.size ? ' · ' + K.fmtSize(r.size) : ''}</span></div>` }] : []),
      ...(!r.fileId ? [{ k: 'url', label: 'Link to the online receipt or order', type: 'url', value: r.url, placeholder: 'https://…', required: true }] : []),
      ...(r.fileId && r.url ? [{ type: 'html', k: '_u', html: `<p class="small" style="margin:-6px 0 12px"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--c)">Open the shared link</a></p>` }] : []),
      { k: 'shop', label: 'Shop / what', value: r.shop, placeholder: 'e.g. Coolblue — headphones' },
      { k: 'amount', label: 'Amount (€)', type: 'number', value: r.amount, half: true },
      { k: 'date', label: 'Date', type: 'date', value: r.date, half: true },
      { k: 'txId', label: 'Payment it belongs to', type: 'select', value: r.txId, options: txOpts },
      { k: 'warranty', label: 'Warranty until (optional)', type: 'date', value: r.warranty, hint: 'Most things have 2 years. You’ll see it under “Still under warranty”.' },
      { k: 'note', label: 'Note', value: r.note, placeholder: 'e.g. order number, return before …' },
    ],
    change(v, form) {
      /* pick the matching payment automatically when the amount matches */
      if (!form.elements.txId.value && v.amount) { const m = near.find(t => Math.abs(K.num(t.amount) - v.amount) < 0.01 && !K.receipts.all().some(x => x.txId === t.id && x.id !== r.id)); if (m) form.elements.txId.value = m.id; }
    },
    save(v) {
      if (v.url && !/^https?:\/\//i.test(v.url)) v.url = 'https://' + v.url;
      Object.assign(r, v); K.receipts.upsert(r); render();
      if (v.txId && v.amount) { const t = K.money.byId(v.txId); if (t && Math.abs(K.num(t.amount) - v.amount) > 0.01) K.toast('Saved. Note: the amount differs from the payment.'); }
    },
    del: () => { if (!confirm('Delete this receipt for good?')) return false; if (r.fileId) K.files.del(r.fileId); K.receipts.remove(r.id); render(); if (isNew || isNewFile) K.toast('Receipt deleted'); },
  });
  f.addEventListener('click', e => { if (e.target.closest('[data-ropen]')) K.files.open(r.fileId); if (e.target.closest('[data-rdl]')) K.files.download(r.fileId); });
}
/* things shared to Life Hub from other apps (Android Share menu) wait in the inbox */
async function checkInbox() {
  let items = []; try { items = await K.files.inbox(); } catch { return; }
  for (const it of items) {
    await K.files.clearInbox(it.id);
    const url = it.url || (String(it.text || '').match(/https?:\/\/\S+/) || [''])[0];
    if (it.fileId) {
      const f = await K.files.get(it.fileId);
      if (f && /pdf/i.test(f.type || f.name)) {   /* a bank statement shared from WhatsApp / Gmail? */
        try {
          const parsed = await K.bank.parsePdf(new File([f.blob], f.name, { type: 'application/pdf' }));
          if (parsed.items.length >= 3 && confirm(`This looks like a bank statement with ${parsed.items.length} payments. Import them into Money?`)) {
            await K.files.del(it.fileId); tab = 'month'; render(); showImport(parsed); continue;
          }
        } catch {}
      }
      const r = { id: K.uid(), fileId: it.fileId, fileName: f ? f.name : 'shared file', type: f ? f.type : '', size: f ? f.size : 0, url, shop: guessShop(it.title || (f && f.name)), date: K.ymd(), amount: '', txId: '', note: it.text && !url ? String(it.text).slice(0, 120) : '', warranty: '' };
      K.receipts.upsert(r); tab = 'receipts'; render(); if (items.length === 1) editReceipt(r, null, true);
    } else if (url) {
      tab = 'receipts'; render(); editReceipt(null, { url, shop: (it.title || '').slice(0, 60) });
    }
  }
  if (items.length > 1) K.toast(`${items.length} things shared to Life Hub. Tap them to add details.`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.tab) { tab = d.tab; history.replaceState(null, '', '#' + tab); render(); }
  else if (d.yr) { yr = String(+yr + +d.yr); render(); }
  else if (d.m) { const [y, m] = ym.split('-').map(Number); ym = K.ymd(new Date(y, m - 1 + +d.m, 1)).slice(0, 7); render(); }
  else if (d.tx) editTx(K.money.byId(d.tx));
  else if (d.budget) editBudget(d.budget);
  else if (d.goal) editGoal(K.savings.byId(d.goal));
  else if (d.add) { const g = K.savings.byId(d.add); const v = K.num(prompt(`How much did you put aside for ${g.name}? (€)`) || 0); if (v) { g.saved = K.num(g.saved) + v; K.savings.upsert(g); render(); K.toast(g.saved >= K.num(g.target) ? `🎉 Goal reached: ${g.name}!` : `${eur(K.num(g.target) - g.saved)} to go`); } }
  else if (d.sub) editSub(K.subs.byId(d.sub));
  else if (d.act === 'import') pickBankFile();
  else if (d.act === 'addReceipt') pickReceipt();
  else if (d.act === 'photoReceipt') pickReceipt('', true);
  else if (d.act === 'linkReceipt') editReceipt(null, { url: '' });
  else if (d.rc) editReceipt(K.receipts.byId(d.rc));
  else if (b.id === 'fab') ({ month: () => editTx(), year: () => editTx(), receipts: () => pickReceipt(), budgets: () => editTx(), savings: () => editGoal(), subs: () => editSub() })[tab]();
});
document.addEventListener('input', e => { if (e.target.id === 'rsearch') { rq = e.target.value; render(); const el = K.$('#rsearch'); el.focus(); el.setSelectionRange(rq.length, rq.length); } });
document.addEventListener('submit', e => { if (e.target.id !== 'quick') return; e.preventDefault(); if (quickAdd(K.$('#q').value)) { render(); K.$('#q').focus(); } });
K.$('#fab').innerHTML = svg('plus');
render();
checkInbox();
pullBank();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkInbox(); pullBank(); } });
</script>
