<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School · Life Hub</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<script src="../hub.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  .lesson { display: grid; grid-template-columns: 54px 4px 1fr; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .lesson:first-child { border-top: 0; }
  .lesson .tm { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .lesson .tm small { display: block; color: var(--muted-2); font-weight: 600; }
  .lesson .bar { width: 4px; height: 36px; border-radius: 4px; background: var(--dot); }
  .lesson.now { background: color-mix(in srgb, var(--dot) 10%, transparent); }
  .lesson.past { opacity: .5; }
  .gap { padding: 6px 14px 6px 80px; font-size: 12px; color: var(--muted-2); border-top: 1px dashed var(--line); }
  .avg { font-size: 22px; font-weight: 800; }
  .avg.low { color: var(--bad); }
  .avg.ok { color: var(--good); }
  .subj { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .subj:first-child { border-top: 0; }
</style>
</head>
<body style="--c:#f2994a">
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button" aria-label="Add"></button>
<script src="../lib/kit.js"></script>
<script src="../lib/agenda.js"></script>
<script src="../lib/ics.js"></script>
<script src="../lib/ai.js"></script>
<script>
const { esc, svg } = K;
const TABS = [['week', 'Timetable'], ['homework', 'Homework'], ['grades', 'Grades'], ['settings', 'Setup']];
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'week';
let day = (() => { const d = new Date().getDay(); return d === 0 || d === 6 ? 1 : d; })();
let showDone = false;
let week = 0, selDate = K.ymd();   /* imported timetable: which week and day you look at */

function subjects() {
  const s = new Set(K.school().subjects.map(x => x.name));
  K.school().lessons.forEach(l => l.subject && s.add(l.subject));
  ((K.feed() || {}).lessons || []).forEach(l => l.subject && s.add(l.subject));
  K.homework.all().forEach(h => h.subject && s.add(h.subject));
  K.grades.all().forEach(g => g.subject && s.add(g.subject));
  return [...s].sort((a, b) => a.localeCompare(b));
}
/* next date this subject is on the timetable, after today */
function nextLessonDate(subject) {
  for (let i = 1; i < 21; i++) { const d = K.addDays(K.ymd(), i); if (K.lessonsOn(d).some(l => l.subject === subject)) return d; }
  return '';
}

function render() {
  let html = K.header('School', 'school') + `<div class="tabs">${TABS.map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${tab === k}">${l}${k === 'homework' ? `<span class="n">${K.homework.all().filter(h => !h.done).length || ''}</span>` : ''}</button>`).join('')}</div>`;
  html += ({ week: weekHtml, homework: hwHtml, grades: gradesHtml, settings: setupHtml })[tab]();
  K.$('#app').innerHTML = html;
  K.$('#fab').hidden = tab === 'settings';
  K.$('#fab').setAttribute('aria-label', { week: 'Add lesson', homework: 'Add homework or test', grades: 'Add grade' }[tab] || 'Add');
}

/* ---------- timetable ---------- */
function weekHtml() {
  const sc = K.school(), today = K.ymd(), nowHm = K.hm(new Date());
  let html = '';
  /* next lesson card */
  let next = null;
  for (let i = 0; i < 14 && !next; i++) { const d = K.addDays(today, i); const l = K.lessonsOn(d).find(l => i > 0 || l.end > nowHm); if (l) next = { l, d }; }
  if (next) {
    const live = next.d === today && next.l.start <= nowHm;
    html += `<div class="card hl" style="--c:${K.subjectColor(next.l.subject)}"><div class="k">${live ? 'Now' : 'Next lesson'} · ${esc(K.fmtDay(next.d))}</div>
      <div class="big">${esc(next.l.subject)}</div><div class="muted">${next.l.start}–${next.l.end}${next.l.room ? ' · room ' + esc(next.l.room) : ''}${next.l.teacher ? ' · ' + esc(next.l.teacher) : ''}</div></div>`;
  }
  const hol = K.isHoliday(today);
  if (hol) html += `<div class="card"><div class="k">Holiday</div><div class="big">🌴 ${esc(hol.name || 'School holiday')}</div><div class="muted">Until ${esc(K.fmtDay(hol.to || hol.from, true))}</div></div>`;
  if (K.feed() && (K.feedCovers(today) || K.feedCovers(K.addDays(today, 7)))) return html + feedWeekHtml();
  html += `<div class="row-btns" style="margin:-2px 0 12px"><button class="btn sm" type="button" data-act="import">📥 Import timetable</button></div>`;
  html += `<div class="tabs">${[1, 2, 3, 4, 5, 6, 0].filter(d => d >= 1 && d <= 5 || sc.lessons.some(l => +l.day === d)).map(d => `<button type="button" data-day="${d}" aria-pressed="${day === d}">${K.DAYS_SHORT[d]}<span class="n">${sc.lessons.filter(l => +l.day === d).length || ''}</span></button>`).join('')}</div>`;
  const ls = sc.lessons.filter(l => +l.day === day).sort((a, b) => a.start < b.start ? -1 : 1);
  if (!sc.lessons.length) return html + `<div class="empty"><b>Add your timetable</b>Tap + to add your first lesson. It repeats every week.<br><br><button class="btn primary" data-act="addLesson" type="button">Add a lesson</button></div>`;
  if (!ls.length) return html + `<div class="empty"><b>No lessons on ${K.DAYS[day]}</b>Tap + to add one.</div>`;
  const isToday = new Date().getDay() === day;
  html += `<div class="list">` + ls.map((l, i) => {
    const prev = ls[i - 1];
    const gap = prev && l.start > prev.end ? `<div class="gap">Break · ${minsBetween(prev.end, l.start)} min</div>` : '';
    const st = isToday && !hol ? (l.end <= nowHm ? 'past' : l.start <= nowHm ? 'now' : '') : '';
    return gap + `<button class="lesson ${st}" type="button" data-lesson="${l.id}" style="--dot:${K.subjectColor(l.subject)}">
      <span class="tm num">${l.start}<small>${l.end}</small></span><span class="bar"></span>
      <span><b>${esc(l.subject)}</b><span class="meta small muted" style="display:block">${[l.room && 'Room ' + esc(l.room), esc(l.teacher || '')].filter(Boolean).join(' · ') || '&nbsp;'}</span></span></button>`;
  }).join('') + `</div>`;
  const first = ls[0], last = ls[ls.length - 1];
  html += `<p class="hint" style="margin-top:6px">${K.DAYS[day]}: ${first.start} to ${last.end} · ${K.plural(ls.length, 'lesson')}. Tap a lesson to change it.</p>`;
  return html;
}
/* imported timetable: real dates, other weeks, cancelled lessons */
function feedWeekHtml() {
  const f = K.feed(), mon = K.addDays(K.weekStart(K.ymd()), 7 * week), nowHm = K.hm(new Date());
  if (selDate < mon || selDate > K.addDays(mon, 6)) { selDate = mon; for (let i = 0; i < 5; i++) if (K.addDays(mon, i) === K.ymd()) selDate = K.ymd(); }
  const days = Array.from({ length: 7 }, (_, i) => K.addDays(mon, i)).filter((d, i) => i < 5 || K.lessonsOn(d, true).length);
  const ago = Math.round((Date.now() - (f.at || 0)) / 36e5);
  let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="iconbtn" type="button" data-week="-1" aria-label="Previous week">${svg('left')}</button>
    <b style="flex:1;text-align:center">${week === 0 ? 'This week' : week === 1 ? 'Next week' : week === -1 ? 'Last week' : 'Week of ' + K.fmtDate(mon)}</b><button class="iconbtn" type="button" data-week="1" aria-label="Next week">${svg('right')}</button></div>`;
  html += `<div class="tabs">${days.map(d => { const n = K.lessonsOn(d).length; return `<button type="button" data-date="${d}" aria-pressed="${selDate === d}">${K.DAYS_SHORT[K.fromYmd(d).getDay()]} ${K.fromYmd(d).getDate()}<span class="n">${n || ''}</span></button>`; }).join('')}</div>`;
  const all = K.isHoliday(selDate) ? [] : K.lessonsOn(selDate, true), hol = K.isHoliday(selDate);
  if (hol) html += `<div class="empty"><b>🌴 ${esc(hol.name || 'No school')}</b></div>`;
  else if (!all.length) html += `<div class="empty"><b>No lessons on ${esc(K.fmtDay(selDate, true))}</b>${selDate > f.to ? 'Your imported timetable doesn’t reach this far yet.' : ''}</div>`;
  else html += `<div class="list">` + all.map((l, i) => {
    const prev = all.slice(0, i).reverse().find(x => !x.cancelled), gap = prev && !l.cancelled && l.start > prev.end ? `<div class="gap">Break · ${minsBetween(prev.end, l.start)} min</div>` : '';
    const st = l.cancelled ? 'past' : selDate === K.ymd() ? (l.end <= nowHm ? 'past' : l.start <= nowHm ? 'now' : '') : '';
    return gap + `<div class="lesson ${st}" style="--dot:${K.subjectColor(l.subject)}"><span class="tm num">${l.start}<small>${l.end}</small></span><span class="bar"></span>
      <span><b style="${l.cancelled ? 'text-decoration:line-through' : ''}">${esc(l.subject)}</b>${l.cancelled ? ' <span class="tag" style="color:var(--bad)">cancelled</span>' : ''}<span class="meta small muted" style="display:block">${[l.room && esc(l.room), esc(l.teacher || '')].filter(Boolean).join(' · ') || '&nbsp;'}</span></span></div>`;
  }).join('') + `</div>`;
  html += `<p class="hint" style="margin-top:6px">${f.source === 'link' ? `📅 From your school calendar · updated ${ago < 1 ? 'less than an hour' : ago + ' h'} ago · <a href="#" data-act="refreshFeed" style="color:var(--ct)">refresh</a>` : f.source === 'photo' ? '📷 From a screenshot' : '📄 From a calendar file'} · until ${esc(K.fmtDate(f.to))} · <a href="#" data-act="import" style="color:var(--ct)">change</a></p>`;
  return html;
}

/* ---------- import timetable ---------- */
function importSheet() {
  const sc = K.school(), f = K.feed();
  const form = K.form({
    title: 'Import your timetable', saveLabel: 'Close',
    fields: [{ type: 'html', k: 'x', html: `
      <div class="list" style="margin-bottom:12px">
        <button class="item" type="button" data-imp="link" style="width:100%"><span style="font-size:22px">📅</span><span class="body"><span class="title">Calendar link <span class="tag" style="color:var(--good)">best</span></span><span class="meta"><span>Stays up to date by itself: changes, cancelled lessons, new weeks.</span></span></span><span class="muted">›</span></button>
        <button class="item" type="button" data-imp="file" style="width:100%"><span style="font-size:22px">📄</span><span class="body"><span class="title">Calendar file (.ics)</span><span class="meta"><span>A file you downloaded. Import it again when it changes.</span></span></span><span class="muted">›</span></button>
        <button class="item" type="button" data-imp="photo" style="width:100%"><span style="font-size:22px">📷</span><span class="body"><span class="title">Screenshot or photo</span><span class="meta"><span>The AI reads your timetable from a picture. Works with any school system.</span></span></span><span class="muted">›</span></button>
      </div>
      <details><summary style="font-weight:700;cursor:pointer">Where do I find the link in Osiris?</summary><ol class="small muted" style="line-height:1.6;padding-left:20px;margin:8px 0 0">
        <li>Open <b>Osiris</b> (the app or the website) and go to <b>Rooster</b> (timetable).</li>
        <li>Look for <b>Agenda koppelen</b>, <b>Exporteren</b>, <b>iCal</b> or a calendar icon (on the website often top right).</li>
        <li>Copy the link (it often starts with <b>https://</b> or <b>webcal://</b> and ends in <b>.ics</b>) and paste it in Life Hub.</li>
        <li>Can’t find it? Use a <b>screenshot</b> of your week, or ask your mentor whether the timetable can be linked to a calendar app.</li></ol></details>
      ${f ? `<button class="btn danger block" type="button" data-imp="remove" style="margin-top:14px">Stop using the imported timetable</button>` : ''}` }],
    save: () => {},
  });
  form.addEventListener('click', e => { const b = e.target.closest('[data-imp]'); if (!b) return; form.parentElement.remove(); ({ link: importLink, file: importFile, photo: importPhoto, remove: removeFeed })[b.dataset.imp](); });
}
function saveFeed(feed) { K.put('schoolfeed', feed); week = 0; selDate = K.ymd(); tab = 'week'; render(); K.toast(`Imported ${K.plural(feed.lessons.length, 'lesson')} until ${K.fmtDate(feed.to)} ✓`); }
function removeFeed() { if (!confirm('Stop using the imported timetable? Your weekly timetable is used again.')) return; const sc = K.school(); delete sc.icsUrl; K.saveSchool(sc); K.put('schoolfeed', null); render(); }
async function fetchFeed(url) {
  const u = url.replace(/^webcal:/i, 'https:');
  const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error('The link answered ' + r.status + '.');
  const t = await r.text(); if (!/BEGIN:VCALENDAR/.test(t)) throw new Error('That link isn’t a calendar.');
  return K.ics.toFeed(t, { source: 'link' });
}
function importLink() {
  const sc = K.school();
  K.form({
    title: 'Calendar link', saveLabel: 'Import',
    fields: [{ k: 'url', label: 'Paste the link from Osiris (Agenda koppelen / Exporteren)', value: sc.icsUrl || '', placeholder: 'https://… or webcal://…', required: true, attrs: 'autocomplete="off" inputmode="url"' },
      { type: 'html', k: 'h', html: `<p class="small muted" style="margin:-4px 0 0">The link is private to you: it’s saved in your own cloud and only used to read your timetable.</p>` }],
    async save(v) {
      const url = v.url.trim(); if (!/^(https?|webcal):\/\//i.test(url)) { K.toast('Paste the whole link, starting with https:// or webcal://'); return false; }
      if (looksLikePage(url) && !v.force) { setTimeout(() => pageNotLink(url), 250); return; }
      sc.icsUrl = url; K.saveSchool(sc);
      try { saveFeed(await fetchFeed(url)); }
      catch (e) {
        /* the school site doesn't let web pages read it: your private job fetches it instead */
        K.toast(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Saved. Your phone can’t read this link directly, so your private job fetches it within about 30 minutes.' : e.message);
        render();
      }
    },
  });
}
/* the Osiris timetable page (needs your login) instead of its calendar link */
function looksLikePage(url) {
  const u = url.toLowerCase();
  if (/\.ics(\?|$)|ical|webcal:|calendar|agenda|feed|export|token=|key=/.test(u)) return false;
  return /osiris-student\.nl\/?(#?\/?(rooster|home|dashboard)?\/?)?$/.test(u.replace(/^https?:\/\//, '')) || /\/rooster\/?$/.test(u);
}
function pageNotLink(url) {
  const f = K.form({ title: 'That’s the page, not the calendar link', saveLabel: 'OK',
    fields: [{ type: 'html', k: 'x', html: `<p style="margin-top:-6px">This address opens your timetable <b>page</b>, which needs your school login. Life Hub needs the <b>calendar link</b> that Osiris makes from that page.</p>
      <ol class="small muted" style="line-height:1.6;padding-left:20px">
        <li>Open the page and log in (on a phone: Chrome ⋮ → <b>Desktop site</b>).</li>
        <li>Above the timetable, top right, look for <b>Exporteren</b>, <b>Agenda koppelen</b>, <b>Abonneren</b>, <b>iCal</b>, a 📅 icon or <b>⋯</b>.</li>
        <li>Choose <b>link</b> / <b>iCal</b> and copy the long address it shows (often with <b>ical</b>, <b>.ics</b> or a long code).</li></ol>
      <p class="small muted">No such button? Use <b>📷 Screenshot</b> instead: take a screenshot of your week and the AI reads it.</p>
      <div class="row-btns"><button class="btn sm" type="button" data-shot>📷 Use a screenshot</button><button class="btn sm" type="button" data-force>It is the calendar link, try anyway</button></div>` }], save: () => {} });
  f.addEventListener('click', async e => {
    if (e.target.closest('[data-shot]')) { f.parentElement.remove(); importPhoto(); }
    if (e.target.closest('[data-force]')) {
      f.parentElement.remove(); const sc = K.school(); sc.icsUrl = url; K.saveSchool(sc);
      try { saveFeed(await fetchFeed(url)); } catch (err) { K.toast(/Failed to fetch|NetworkError|Load failed/i.test(err.message) ? 'Saved. Your private job will try to read it within about 30 minutes; School → Setup shows if it worked.' : err.message); render(); }
    }
  });
}
function importFile() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.ics,text/calendar';
  i.onchange = async () => { const f = i.files[0]; if (!f) return; try { saveFeed(K.ics.toFeed(await f.text(), { source: 'file' })); } catch (e) { K.toast(e.message); } };
  i.click();
}
function importPhoto() {
  if (!K.aiReady()) { K.toast('Add your AI key first: Life Hub Settings → AI assistant.'); return; }
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
  i.onchange = async () => {
    const files = [...i.files]; if (!files.length) return;
    K.toast('Reading your timetable…');
    const prompt = `This is a picture of a school timetable (rooster) of a student in the Netherlands. Today is ${K.ymd()} (${K.DAYS[new Date().getDay()]}).
Return ONLY JSON: {"dated": true|false, "lessons": [{"date": "YYYY-MM-DD or empty", "day": "Monday..Sunday", "start": "HH:MM", "end": "HH:MM", "subject": "", "room": "", "teacher": "", "cancelled": false}]}
Use "dated": true and fill "date" when the picture shows dates; otherwise give only "day". 24-hour times. Keep subject names as written. Leave out breaks and empty slots.`;
    try {
      const raw = await K.ai(prompt, { json: true, images: files });
      const j = JSON.parse(raw.replace(/^```(?:json)?|```$/g, '').trim()), ls = (j.lessons || []).filter(l => /^\d{1,2}:\d\d$/.test(l.start) && l.subject);
      if (!ls.length) throw new Error('I couldn’t find lessons in that picture. Try a clearer screenshot of one week.');
      previewPhoto(j.dated && ls.every(l => /^\d{4}-\d\d-\d\d$/.test(l.date)), ls);
    } catch (e) { K.toast(e.nokey ? e.message : 'Couldn’t read it: ' + e.message); }
  };
  i.click();
}
function previewPhoto(dated, ls) {
  const DN = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, zondag: 0, maandag: 1, dinsdag: 2, woensdag: 3, donderdag: 4, vrijdag: 5, zaterdag: 6 };
  const norm = t => String(t).replace(/^(\d):/, '0$1:');
  const rows = ls.map(l => ({ ...l, start: norm(l.start), end: norm(l.end || l.start), d: dated ? l.date : DN[String(l.day).toLowerCase()] })).filter(l => dated || l.d != null);
  K.form({
    title: `Found ${K.plural(rows.length, 'lesson')}`, saveLabel: dated ? 'Use these dates' : 'Use as my weekly timetable',
    fields: [{ type: 'html', k: 'x', html: `<p class="small muted" style="margin-top:-6px">${dated ? 'These are for the dates shown in your picture.' : 'No dates in the picture, so these repeat every week.'} Check them, then tap the button.</p>
      <div class="list" style="max-height:50vh;overflow-y:auto">${rows.map(l => `<div class="item"><span class="body"><span class="title">${esc(l.subject)}</span><span class="meta"><span>${dated ? esc(K.fmtDay(l.d)) : K.DAYS[l.d]} ${l.start}–${l.end}</span>${l.room ? `<span>${esc(l.room)}</span>` : ''}${l.teacher ? `<span>${esc(l.teacher)}</span>` : ''}${l.cancelled ? '<span class="late">cancelled</span>' : ''}</span></span></div>`).join('')}</div>` }],
    save() {
      if (dated) { const dates = rows.map(l => l.d).sort();
        saveFeed({ source: 'photo', at: Date.now(), from: K.weekStart(dates[0]), to: K.addDays(K.weekStart(dates[dates.length - 1]), 6), holidays: [], lessons: rows.map(l => ({ id: K.uid(), date: l.d, start: l.start, end: l.end, subject: l.subject, room: l.room || '', teacher: l.teacher || '', cancelled: !!l.cancelled })) }); }
      else { const sc = K.school(); sc.lessons = rows.map(l => K.stamp({ id: K.uid(), day: l.d, start: l.start, end: l.end, subject: l.subject, room: l.room || '', teacher: l.teacher || '' })); K.saveSchool(sc); tab = 'week'; render(); K.toast(`Timetable saved: ${K.plural(rows.length, 'lesson')} a week ✓`); }
    },
  });
}
/* a calendar link: refresh it now and then from this phone, if the school site allows it */
async function refreshFeed(force) {
  const sc = K.school(), f = K.feed(); if (!sc.icsUrl) return;
  if (!force && f && f.source === 'link' && Date.now() - (f.at || 0) < 6 * 36e5) return;
  try { const nf = await fetchFeed(sc.icsUrl); K.put('schoolfeed', nf); if (tab === 'week') render(); if (force) K.toast('Timetable updated ✓'); }
  catch { if (force) K.toast('Your phone can’t read the link directly. Your private job updates it every few hours.'); }
}

function minsBetween(a, b) { const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); return (h2 * 60 + m2) - (h1 * 60 + m1); }

function editLesson(l, preset) {
  const isNew = !l;
  l = l || Object.assign({ id: K.uid(), day, start: '08:30', end: '09:20', subject: '', room: '', teacher: '' }, preset || {});
  const subs = subjects();
  K.form({
    title: isNew ? 'Add lesson' : 'Edit lesson',
    fields: [
      { k: 'subject', label: 'Subject', value: l.subject, required: true, attrs: 'list="subjlist"' },
      { type: 'html', k: '_dl', html: `<datalist id="subjlist">${subs.map(s => `<option value="${esc(s)}">`).join('')}</datalist>` },
      { k: 'day', label: 'Day', type: 'seg', value: String(l.day), options: [1, 2, 3, 4, 5, 6, 0].map(d => [String(d), K.DAYS_SHORT[d]]) },
      { k: 'start', label: 'Starts', type: 'time', value: l.start, half: true, required: true },
      { k: 'end', label: 'Ends', type: 'time', value: l.end, half: true, required: true },
      { k: 'room', label: 'Room', value: l.room, half: true },
      { k: 'teacher', label: 'Teacher', value: l.teacher, half: true },
      ...(isNew ? [{ k: 'again', label: 'Add the next lesson after this', type: 'checkbox', value: true }] : []),
    ],
    save(v) {
      if (v.end <= v.start) { K.toast('The lesson has to end after it starts'); return false; }
      Object.assign(l, { subject: v.subject, day: +v.day, start: v.start, end: v.end, room: v.room, teacher: v.teacher });
      const sc = K.school(); const i = sc.lessons.findIndex(x => x.id === l.id);
      K.stamp(l); if (i < 0) sc.lessons.push(l); else sc.lessons[i] = l;
      K.saveSchool(sc); day = l.day; render();
      if (v.again) setTimeout(() => { const len = minsBetween(v.start, v.end); editLesson(null, { day: l.day, start: v.end, end: addMins(v.end, len) }); }, 250);
    },
    del: isNew ? null : () => { const sc = K.school(); sc.lessons = sc.lessons.filter(x => x.id !== l.id); K.saveSchool(sc); render(); K.toast('Lesson deleted'); },
  });
}
function addMins(hm, n) { const [h, m] = hm.split(':').map(Number); const t = Math.min(23 * 60 + 59, h * 60 + m + n); return K.pad(Math.floor(t / 60)) + ':' + K.pad(t % 60); }

/* ---------- homework & tests ---------- */
function hwHtml() {
  const all = K.homework.all(), today = K.ymd();
  const open = all.filter(h => !h.done).sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1);
  const done = all.filter(h => h.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let html = '';
  const tests = open.filter(h => h.type === 'test' && h.due >= today).slice(0, 3);
  if (tests.length) html += `<div class="grid2">${tests.slice(0, 2).map(t => { const n = K.daysUntil(t.due); return `<div class="stat" style="--c:${K.subjectColor(t.subject)}"><div class="k">Test · ${esc(t.subject || '')}</div><div class="v num">${n === 0 ? 'Today' : n}<small>${n === 0 ? '' : n === 1 ? ' day' : ' days'}</small></div><div class="s">${esc(t.title)}</div></div>`; }).join('')}</div>`;
  if (!open.length) html += `<div class="empty"><b>All homework done 🎉</b>Tap + to add homework, a test or an assignment.</div>`;
  const groups = [['Overdue', h => h.due && h.due < today], ['Today', h => h.due === today], ['Tomorrow', h => h.due === K.addDays(today, 1)],
    ['This week', h => h.due > K.addDays(today, 1) && h.due <= K.addDays(today, 7)], ['Later', h => h.due > K.addDays(today, 7)], ['No date', h => !h.due]];
  for (const [name, fn] of groups) { const l = open.filter(fn); if (l.length) html += `<div class="sec">${name}</div><div class="list">${l.map(hwItem).join('')}</div>`; }
  if (done.length) {
    html += `<div class="sec">Done<button class="act" type="button" data-act="toggleDone">${showDone ? 'Hide' : 'Show ' + done.length}</button></div>`;
    if (showDone) html += `<div class="list">${done.slice(0, 40).map(hwItem).join('')}</div>`;
  }
  const sc = K.school();
  html += `<p class="hint" style="margin-top:14px">${sc.remindHw !== false ? `🔔 You get a reminder at ${sc.remindTime || '19:00'} the evening before, and 3 days before a test.` : 'Homework reminders are off (Setup).'}</p>`;
  return html;
}
function hwItem(h) {
  const late = !h.done && h.due && h.due < K.ymd();
  const typeTag = h.type === 'test' ? '<span class="tag" style="color:var(--bad)">Test</span>' : h.type === 'assignment' ? '<span class="tag">Assignment</span>' : '';
  return `<div class="item ${h.done ? 'done' : ''}" style="--dot:${K.subjectColor(h.subject)}">
    <span class="bar"></span>
    <button class="check ${h.done ? 'on' : ''}" type="button" data-hwdone="${h.id}" aria-label="${h.done ? 'Not done' : 'Done'}: ${esc(h.title)}" style="--c:${K.subjectColor(h.subject)}">${svg('check')}</button>
    <button class="body" type="button" data-hw="${h.id}"><div class="title">${esc(h.title)}</div>
      <div class="meta"><span style="color:${K.subjectColor(h.subject)};font-weight:700">${esc(h.subject || 'No subject')}</span>${h.due ? `<span class="${late ? 'late' : ''}">${esc(K.fmtDay(h.due))}</span>` : ''}${typeTag}${h.notes ? '<span>📝</span>' : ''}</div></button></div>`;
}
function editHw(h) {
  const isNew = !h;
  h = h || { id: K.uid(), subject: '', title: '', type: 'homework', due: K.addDays(K.ymd(), 1), notes: '', done: false };
  const subs = subjects();
  const form = K.form({
    title: isNew ? 'Add homework' : 'Edit',
    fields: [
      { k: 'type', label: 'Type', type: 'seg', value: h.type, options: [['homework', 'Homework'], ['test', 'Test'], ['assignment', 'Assignment']] },
      { k: 'subject', label: 'Subject', value: h.subject, attrs: 'list="subjlist2"' },
      { type: 'html', k: '_dl', html: `<datalist id="subjlist2">${subs.map(s => `<option value="${esc(s)}">`).join('')}</datalist>` },
      { k: 'title', label: 'What', value: h.title, required: true, placeholder: 'e.g. Read chapter 4, exercises 1–6' },
      { k: 'due', label: 'Due', type: 'date', value: h.due },
      { type: 'html', k: '_nl', html: `<div class="row-btns" style="margin:-4px 0 12px"><button class="btn sm" type="button" data-due="1">Tomorrow</button><button class="btn sm" type="button" data-due="next">Next lesson</button><button class="btn sm" type="button" data-due="7">In a week</button></div>` },
      { k: 'notes', label: 'Notes', type: 'textarea', value: h.notes, attrs: 'rows="2" style="min-height:60px"' },
    ],
    save(v) { Object.assign(h, { type: v.type, subject: v.subject, title: v.title, due: v.due, notes: v.notes }); K.homework.upsert(h); render(); if (isNew && !K.notifyOn() && K.school().remindHw !== false) K.askNotify(); },
    del: isNew ? null : () => { K.homework.remove(h.id); render(); K.toast('Deleted', () => { K.homework.upsert(h); render(); }); },
  });
  form.addEventListener('click', e => {
    const b = e.target.closest('[data-due]'); if (!b) return;
    const subj = form.elements.subject.value.trim();
    let d = b.dataset.due === 'next' ? nextLessonDate(subj) : K.addDays(K.ymd(), +b.dataset.due);
    if (!d) { K.toast(subj ? `${subj} isn’t on your timetable` : 'Pick the subject first'); return; }
    form.elements.due.value = d; K.toast('Due ' + K.fmtDayIn(d));
  });
}

/* ---------- grades ---------- */
function avgOf(gs) { const w = gs.reduce((s, g) => s + (+g.weight || 1), 0); return w ? gs.reduce((s, g) => s + K.num(g.grade) * (+g.weight || 1), 0) / w : 0; }
function gradesHtml() {
  const gs = K.grades.all();
  if (!gs.length) return `<div class="empty"><b>No grades yet</b>Tap + to add a grade. You’ll see your average per subject and what you need on the next test.</div>`;
  const by = {}; gs.forEach(g => (by[g.subject || 'Other'] = by[g.subject || 'Other'] || []).push(g));
  const subjAvg = Object.entries(by).map(([s, l]) => [s, avgOf(l), l]);
  const overall = subjAvg.reduce((a, x) => a + x[1], 0) / subjAvg.length;
  const lows = subjAvg.filter(x => x[1] < 5.5).length;
  let html = `<div class="grid2"><div class="stat"><div class="k">Average</div><div class="v num avg ${overall < 5.5 ? 'low' : 'ok'}">${overall.toFixed(1)}</div><div class="s">${K.plural(subjAvg.length, 'subject')}</div></div>
    <div class="stat"><div class="k">Below 5.5</div><div class="v num" style="color:${lows ? 'var(--bad)' : 'var(--good)'}">${lows}</div><div class="s">${lows ? 'Needs work' : 'All passing'}</div></div></div>`;
  html += `<div class="sec">Per subject</div><div class="list">${subjAvg.sort((a, b) => a[0].localeCompare(b[0])).map(([s, a, l]) => `
    <button class="subj" type="button" data-subj="${esc(s)}"><span class="bar" style="width:4px;height:34px;border-radius:4px;background:${K.subjectColor(s)}"></span>
    <span style="flex:1;min-width:0"><b>${esc(s)}</b><span class="small muted" style="display:block">${l.map(g => K.num(g.grade).toFixed(1)).slice(-6).join(' · ')}</span></span>
    <span class="avg num ${a < 5.5 ? 'low' : ''}" style="font-size:19px">${a.toFixed(1)}</span></button>`).join('')}</div>`;
  html += `<div class="sec">Latest</div><div class="list">${gs.slice().sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1).slice(0, 15).map(g => `
    <button class="item" type="button" data-grade="${g.id}" style="width:100%;--dot:${K.subjectColor(g.subject)}"><span class="bar"></span><span class="body"><span class="title">${esc(g.title || g.subject)}</span>
    <span class="meta"><span>${esc(g.subject || '')}</span>${g.date ? `<span>${esc(K.fmtDay(g.date))}</span>` : ''}${+g.weight !== 1 ? `<span>weight ${g.weight}×</span>` : ''}</span></span>
    <span class="right num ${K.num(g.grade) < 5.5 ? 'late' : ''}" style="font-size:18px;${K.num(g.grade) < 5.5 ? 'color:var(--bad)' : ''}">${K.num(g.grade).toFixed(1)}</span></button>`).join('')}</div>
    <p class="hint">Tap a subject to see what you need on your next test.</p>`;
  return html;
}
function editGrade(g) {
  const isNew = !g;
  g = g || { id: K.uid(), subject: '', grade: '', weight: 1, title: '', date: K.ymd() };
  K.form({
    title: isNew ? 'Add grade' : 'Edit grade',
    fields: [
      { k: 'subject', label: 'Subject', value: g.subject, required: true, attrs: 'list="subjlist3"' },
      { type: 'html', k: '_dl', html: `<datalist id="subjlist3">${subjects().map(s => `<option value="${esc(s)}">`).join('')}</datalist>` },
      { k: 'grade', label: 'Grade (1–10)', type: 'number', value: g.grade, required: true, half: true },
      { k: 'weight', label: 'Weight', type: 'number', value: g.weight, half: true, hint: '1 = normal, 2 = counts double' },
      { k: 'title', label: 'What for', value: g.title, placeholder: 'e.g. Test chapter 3' },
      { k: 'date', label: 'Date', type: 'date', value: g.date },
    ],
    save(v) {
      if (v.grade < 1 || v.grade > 10) { K.toast('A grade is between 1 and 10'); return false; }
      Object.assign(g, { subject: v.subject, grade: v.grade, weight: v.weight || 1, title: v.title, date: v.date }); K.grades.upsert(g); render();
    },
    del: isNew ? null : () => { K.grades.remove(g.id); render(); K.toast('Grade deleted', () => { K.grades.upsert(g); render(); }); },
  });
}
function needFor(subject) {
  const gs = K.grades.all().filter(g => (g.subject || 'Other') === subject);
  const a = avgOf(gs);
  const form = K.form({
    title: `${subject}: what do I need?`, saveLabel: 'Close',
    fields: [
      { type: 'html', k: '_now', html: `<p class="muted" style="margin-top:-6px">Your average now: <b style="color:var(--ink)">${a.toFixed(2)}</b> from ${K.plural(gs.length, 'grade')}.</p>` },
      { k: 'target', label: 'Average I want', type: 'number', value: 5.5, half: true },
      { k: 'weight', label: 'Weight of next test', type: 'number', value: 1, half: true },
      { type: 'html', k: '_out', html: `<div class="card hl" id="needOut" style="margin:0"></div>` },
    ],
    change: v => calc(v), save: () => {},
  });
  const calc = v => {
    const W = gs.reduce((s, g) => s + (+g.weight || 1), 0), S = gs.reduce((s, g) => s + K.num(g.grade) * (+g.weight || 1), 0);
    const w = +v.weight || 1, need = ((+v.target || 5.5) * (W + w) - S) / w;
    form.querySelector('#needOut').innerHTML = need > 10 ? `<div class="k">Not possible with one test</div><div class="big">You’d need ${need.toFixed(1)}</div>`
      : need < 1 ? `<div class="k">You’re safe</div><div class="big">Even a 1.0 keeps you at ${(+v.target).toFixed(1)}</div>`
      : `<div class="k">You need at least</div><div class="big num">${need.toFixed(1)}</div>`;
  };
  calc({ target: 5.5, weight: 1 });
}

/* ---------- setup ---------- */
function setupHtml() {
  const sc = K.school(), f = K.feed();
  let html = `<div class="sec">Timetable</div><div class="card"><div class="big" style="font-size:16px">${f && f.lessons && f.lessons.length ? (f.source === 'link' ? '📅 Linked to your school calendar' : f.source === 'photo' ? '📷 Imported from a screenshot' : '📄 Imported from a calendar file') : '✍️ Typed in by hand'}</div>
    <div class="muted small" style="margin-top:4px">${f && f.lessons && f.lessons.length ? `${K.plural(f.lessons.length, 'lesson')} until ${esc(K.fmtDate(f.to))}` : `${K.plural(sc.lessons.length, 'lesson')} a week`}</div>
    ${sc.icsUrl && f && f.error ? `<div class="small" style="color:var(--bad);margin-top:6px">⚠️ Your calendar link didn’t work (${esc(f.error)}). ${looksLikePage(sc.icsUrl) ? 'It’s the timetable page, not the calendar link.' : 'Check the link in Osiris.'}</div>`
      : sc.icsUrl && !(f && f.lessons && f.lessons.length) ? `<div class="small" style="color:var(--warn);margin-top:6px">⏳ Calendar link saved. Waiting for your private job to read it (within about 30 minutes).</div>` : ''}
    <button class="btn sm" type="button" data-act="import" style="margin-top:10px">📥 ${f ? 'Change' : 'Import timetable'}</button></div>`;
  html += `<div class="sec">Subjects<button class="act" type="button" data-act="addSubject">+ Add</button></div>`;
  const subs = subjects();
  html += subs.length ? `<div class="list">${subs.map(s => `<button class="item" type="button" data-editsubj="${esc(s)}" style="width:100%"><span class="tag" style="--dot:${K.subjectColor(s)}"><i></i></span><span class="body title">${esc(s)}</span><span class="muted">›</span></button>`).join('')}</div>` : `<p class="hint" style="margin:0 2px 12px">Subjects are added automatically from your timetable.</p>`;
  html += `<div class="sec">Holidays<button class="act" type="button" data-act="addHoliday">+ Add</button></div>`;
  const hs = sc.holidays.slice().sort((a, b) => a.from < b.from ? -1 : 1);
  html += hs.length ? `<div class="list">${hs.map(h => `<button class="item" type="button" data-hol="${h.id}" style="width:100%"><span class="body"><span class="title">🌴 ${esc(h.name || 'Holiday')}</span><span class="meta">${esc(K.fmtDate(h.from))} – ${esc(K.fmtDate(h.to || h.from))}</span></span></button>`).join('')}</div>` : `<p class="hint" style="margin:0 2px 12px">Add school holidays so your timetable doesn’t show lessons on those days.</p>`;
  html += `<div class="sec">Reminders</div><div class="card">
    <label class="item" style="padding:0 0 10px;border:0;min-height:0"><span class="body title">Homework & test reminders</span><input type="checkbox" id="remHw" ${sc.remindHw !== false ? 'checked' : ''}></label>
    <label class="item" style="padding:10px 0 0;min-height:0"><span class="body title">Remind me at</span><input type="time" id="remTime" value="${esc(sc.remindTime || '19:00')}" style="width:auto"></label></div>`;
  html += `<div class="sec">Danger zone</div><button class="btn danger block" type="button" data-act="clearTT">Delete the whole timetable</button>`;
  return html;
}
function editSubject(name) {
  const sc = K.school(); const s = sc.subjects.find(x => x.name === name) || { name: name || '', color: K.subjectColor(name) };
  K.form({
    title: name ? 'Edit subject' : 'Add subject',
    fields: [{ k: 'name', label: 'Name', value: s.name, required: true }, K.colorField('color', s.color)],
    save(v) {
      const old = s.name; Object.assign(s, { name: v.name, color: v.color });
      sc.subjects = sc.subjects.filter(x => x.name !== old).concat([s]);
      if (old && old !== v.name) {   /* rename everywhere */
        sc.lessons.forEach(l => { if (l.subject === old) l.subject = v.name; });
        K.homework.save(K.homework.all().map(h => h.subject === old ? { ...h, subject: v.name } : h));
        K.grades.save(K.grades.all().map(g => g.subject === old ? { ...g, subject: v.name } : g));
      }
      K.saveSchool(sc); render();
    },
  });
}
function editHoliday(h) {
  const isNew = !h; h = h || { id: K.uid(), name: '', from: K.ymd(), to: K.addDays(K.ymd(), 7) };
  K.form({
    title: isNew ? 'Add holiday' : 'Edit holiday',
    fields: [{ k: 'name', label: 'Name', value: h.name, placeholder: 'e.g. Christmas holiday' }, { k: 'from', label: 'First day', type: 'date', value: h.from, half: true, required: true }, { k: 'to', label: 'Last day', type: 'date', value: h.to, half: true, required: true }],
    save(v) { if (v.to < v.from) { K.toast('The last day is before the first day'); return false; } Object.assign(h, v); const sc = K.school(); sc.holidays = sc.holidays.filter(x => x.id !== h.id).concat([h]); K.saveSchool(sc); render(); },
    del: isNew ? null : () => { const sc = K.school(); sc.holidays = sc.holidays.filter(x => x.id !== h.id); K.saveSchool(sc); render(); },
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; history.replaceState(null, '', '#' + tab); render(); }
  else if (d.day) { day = +d.day; render(); }
  else if (d.date) { selDate = d.date; render(); }
  else if (d.week) { week += +d.week; selDate = ''; render(); }
  else if (d.act === 'import') importSheet();
  else if (d.lesson) editLesson(K.school().lessons.find(l => l.id === d.lesson));
  else if (d.hwdone) { const h = K.homework.byId(d.hwdone); h.done = !h.done; h.doneAt = h.done ? Date.now() : null; K.homework.upsert(h); render(); if (h.done) K.toast('Done ✓', () => { h.done = false; K.homework.upsert(h); render(); }); }
  else if (d.hw) editHw(K.homework.byId(d.hw));
  else if (d.grade) editGrade(K.grades.byId(d.grade));
  else if (d.subj) needFor(d.subj);
  else if (d.editsubj) editSubject(d.editsubj);
  else if (d.hol) editHoliday(K.school().holidays.find(h => h.id === d.hol));
  else if (d.act === 'addLesson') editLesson();
  else if (d.act === 'toggleDone') { showDone = !showDone; render(); }
  else if (d.act === 'addSubject') editSubject('');
  else if (d.act === 'addHoliday') editHoliday();
  else if (d.act === 'clearTT') { if (confirm('Delete every lesson in your timetable?')) { const sc = K.school(); sc.lessons = []; K.saveSchool(sc); render(); } }
  else if (b.id === 'fab') ({ week: () => editLesson(), homework: () => editHw(), grades: () => editGrade() })[tab]?.();
});
document.addEventListener('change', e => {
  if (e.target.id === 'remHw') { const sc = K.school(); sc.remindHw = e.target.checked; K.saveSchool(sc); if (sc.remindHw) K.askNotify(); }
  if (e.target.id === 'remTime') { const sc = K.school(); sc.remindTime = e.target.value || '19:00'; K.saveSchool(sc); K.toast('Saved'); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-act]'); if (!a) return; e.preventDefault();
  if (a.dataset.act === 'import') importSheet(); else if (a.dataset.act === 'refreshFeed') refreshFeed(true);
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { tab = h; render(); } });
K.$('#fab').innerHTML = svg('plus');
render();
refreshFeed();
setInterval(() => { if (tab === 'week' && document.visibilityState === 'visible') render(); }, 60000);
</script>
</body>
</html>
